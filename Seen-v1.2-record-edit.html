function today(){const d=new Date(),o=d.getTimezoneOffset();return new Date(d.getTime()-o*60000).toISOString().slice(0,10)}function yesterday(){const d=new Date();d.setDate(d.getDate()-1);const o=d.getTimezoneOffset();return new Date(d.getTime()-o*60000).toISOString().slice(0,10)}function dateText(v){if(!v)return"";const[y,m,d]=v.split("-").map(Number),now=new Date(),a=new Date(now.getFullYear(),now.getMonth(),now.getDate()),b=new Date(y,m-1,d),diff=Math.round((a-b)/86400000);if(diff===0)return`오늘 · ${y}.${String(m).padStart(2,"0")}.${String(d).padStart(2,"0")}`;if(diff===1)return`어제 · ${y}.${String(m).padStart(2,"0")}.${String(d).padStart(2,"0")}`;return`${y}. ${String(m).padStart(2,"0")}. ${String(d).padStart(2,"0")}`}function typeInfo(id){return TYPES.find(t=>t.id===id)||TYPES[0]}function stars(n){return"★".repeat(n||0)+"☆".repeat(5-(n||0))}function esc(v){return String(v||"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"})[c])}function count(n){return new Intl.NumberFormat("ko-KR").format(Number(n||0))}function toast(m){el.toast.textContent=m;el.toast.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>el.toast.classList.remove("show"),2400)}function open(o){o.classList.add("show")}function close(o){o.classList.remove("show")}function cover(r,c="cover"){return`<div class="${c}">${r.thumbnailUrl?`<img src="${esc(r.thumbnailUrl)}" alt="">`:typeInfo(r.type).icon}</div>`}
function renderTabs(){document.querySelectorAll(".main-tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===state.tab))}function renderFilters(){el.filters.innerHTML=TYPES.map(t=>`<button class="filter-button ${state.filter===t.id?"active":""}" data-filter="${t.id}" type="button">${t.label}</button>`).join("")}function renderRecords(){const list=state.records.filter(r=>r.status===state.tab&&(state.filter==="all"||r.type===state.filter)).sort((a,b)=>String(b.status==="completed"?b.watchedAt:b.createdAt).localeCompare(String(a.status==="completed"?a.watchedAt:a.createdAt)));if(!list.length){const w=state.tab==="wishlist";el.recordList.innerHTML=`<div class="empty-state"><span class="empty-icon">${w?"☾":"✦"}</span><h3>${w?"보고 싶은 콘텐츠가 없습니다":"아직 기록이 없습니다"}</h3><p>${w?"나중에 보고 싶은 작품을 가볍게 저장해 보세요.":"첫 감상 기록을 남겨 보세요.<br>별점 하나로 충분합니다."}</p></div>`;return}el.recordList.innerHTML=list.map(r=>{const w=r.status==="wishlist",year=r.releaseYear?` · ${r.releaseYear}`:"",creator=r.type==="book"&&r.creator?` · ${r.creator}`:"";return`<article class="record-card" data-id="${r.id}">${cover(r)}<div class="record-main"><h3 class="record-title">${esc(r.title)}</h3><p class="record-meta">${typeInfo(r.type).label}${creator}${year} · ${w?"보고 싶은 목록":dateText(r.watchedAt)}</p>${w?(r.note?`<p class="wishlist-note">${esc(r.note)}</p>`:""):`<p class="record-rating">${stars(r.rating)}</p>`}</div><button class="delete-button" data-delete="${r.id}" type="button">⌫</button></article>`}).join("")}
function renderTypes(){el.typeChoices.innerHTML=TYPES.filter(t=>t.id!=="all").map(t=>`<button class="type-choice ${state.type===t.id?"selected":""}" data-type="${t.id}" type="button">${t.label}</button>`).join("")}function renderStars(){el.ratingChoices.innerHTML=[1,2,3,4,5].map(n=>`<button class="star-button ${n<=state.rating?"selected":""}" data-rating="${n}" type="button">★</button>`).join("")}function renderDateChoices(){el.watchedAtInput.value=state.selectedDate||today()}function updateMode(){const w=el.unseenInput.checked;el.titleLabel.textContent=w?"무엇을 기록하시나요?":"무엇을 보셨나요?";el.unseenHelp.textContent=w?"별점 없이 보고 싶은 목록에 저장됩니다.":"켜면 보고 싶은 목록에 저장됩니다.";el.ratingField.classList.toggle("hidden",w);el.dateField.classList.toggle("hidden",w);el.noteLabel.innerHTML=w?"메모 <span style='color:#77776f;font-weight:600'>· 선택</span>":"한 줄 감상 <span style='color:#77776f;font-weight:600'>· 선택</span>";el.noteHint.textContent=w?"왜 저장했는지 또는 언제 볼지 가볍게 남겨 보세요.":"나중의 나에게 남기는 짧은 메모입니다.";el.saveButton.textContent=w?"보고 싶은 목록에 추가":state.editingWishlistId?"감상 완료로 저장":"기록 저장"}function renderLinked(){if(!state.selectedMedia){el.linkedWork.classList.remove("show");return}el.linkedWork.classList.add("show");const label=state.selectedMedia.source==="google-books"?"Google Books":"TMDb";const info=state.selectedMedia.source==="google-books"?state.selectedMedia.creator:state.selectedMedia.year;el.linkedWork.querySelector("span").textContent=`✓ ${label} 연결됨 · ${state.selectedMedia.title}${info?` · ${info}`:""}`}function renderForm(){renderTypes();renderStars();renderDateChoices();updateMode();renderLinked()}
function clearResults(){clearTimeout(state.searchTimer);if(state.searchAbort)state.searchAbort.abort();state.searchAbort=null;el.searchStatus.textContent="";el.searchResults.classList.remove("show");el.searchResults.innerHTML="";el.searchResults._items=[]}function isBook(){return state.type==="book"}function canTmdbSearch(){return["movie","series","animation","documentary"].includes(state.type)}function startSearch(){clearResults();state.selectedMedia=null;renderLinked();const q=el.titleInput.value.trim();if(q.length<2)return;state.searchTimer=setTimeout(()=>isBook()?searchGoogleBooks(q):searchTmdb(q),450)}
async function searchTmdb(q){try{state.searchAbort=new AbortController();el.searchStatus.textContent="검색 중…";const res=await fetch(`${WORKER_URL}/search?q=${encodeURIComponent(q)}&type=${encodeURIComponent(state.type)}`,{signal:state.searchAbort.signal});if(!res.ok)throw Error();const data=await res.json(),items=Array.isArray(data.results)?data.results:[];el.searchStatus.textContent=items.length?"작품을 선택하면 포스터와 정보가 연결됩니다.":"검색 결과가 없습니다. 직접 입력으로 저장할 수 있습니다.";el.searchResults._items=items;el.searchResults.innerHTML=items.map((r,i)=>{const rating=Number(r.tmdbRating)>0&&Number(r.tmdbVoteCount)>0?`<span class="result-rating">TMDb ${Number(r.tmdbRating).toFixed(1)} · ${count(r.tmdbVoteCount)}명</span>`:"";return`<button class="search-result" data-result="${i}" type="button"><span class="search-result-cover">${r.posterUrl?`<img src="${esc(r.posterUrl)}" alt="">`:(r.mediaType==="tv"?"📺":"🎬")}</span><span class="search-result-copy"><span class="search-result-title">${esc(r.title)}</span><span class="search-result-meta">${esc(r.originalTitle)}${r.year?` · ${r.year}`:""}</span>${rating}</span></button>`}).join("")+`<button class="direct-entry" id="directEntryButton" type="button">직접 입력으로 계속</button>`;el.searchResults.classList.add("show")}catch(e){if(e.name!=="AbortError"){el.searchStatus.textContent="검색할 수 없습니다. 직접 입력으로 계속할 수 있습니다.";el.searchResults.innerHTML=`<button class="direct-entry" id="directEntryButton" type="button">직접 입력으로 계속</button>`;el.searchResults.classList.add("show")}}}
function mapGoogleBook(item){const v=item.volumeInfo||{},links=v.imageLinks||{},ids=Array.isArray(v.industryIdentifiers)?v.industryIdentifiers:[],isbn13=ids.find(x=>x.type==="ISBN_13"),isbn10=ids.find(x=>x.type==="ISBN_10");let thumb=links.thumbnail||links.smallThumbnail||null;if(thumb)thumb=thumb.replace(/^http:/,"https:");return{id:item.id,source:"google-books",title:v.title||"제목 없음",creator:Array.isArray(v.authors)?v.authors.join(", "):"",publisher:v.publisher||null,isbn:isbn13?.identifier||isbn10?.identifier||null,year:v.publishedDate?String(v.publishedDate).slice(0,4):null,posterUrl:thumb,overview:v.description||""}}
async function searchGoogleBooks(q){try{state.searchAbort=new AbortController();el.searchStatus.textContent="Google Books 검색 중…";const url=WORKER_URL+"/search?q="+encodeURIComponent(q)+"&type=book";const res=await fetch(url,{signal:state.searchAbort.signal});if(!res.ok)throw Error("GOOGLE_BOOKS_FAILED");const data=await res.json(),items=Array.isArray(data.results)?data.results:[];el.searchStatus.textContent=items.length?"책을 선택하면 표지와 책 정보가 연결됩니다.":"검색 결과가 없습니다. 직접 입력으로 저장할 수 있습니다.";el.searchResults._items=items;el.searchResults.innerHTML=items.map((r,i)=>`<button class="search-result" data-result="${i}" type="button"><span class="search-result-cover">${r.posterUrl?`<img src="${esc(r.posterUrl)}" alt="">`:"📚"}</span><span class="search-result-copy"><span class="search-result-title">${esc(r.title)}</span><span class="search-result-author">${esc(r.creator||"저자 정보 없음")}${r.year?` · ${esc(r.year)}`:""}</span></span></button>`).join("")+`<button class="direct-entry" id="directEntryButton" type="button">직접 입력으로 계속</button>`;el.searchResults.classList.add("show")}catch(e){if(e.name!=="AbortError"){el.searchStatus.textContent="Google Books에서 검색할 수 없습니다. 직접 입력으로 계속할 수 있습니다.";el.searchResults.innerHTML=`<button class="direct-entry" id="directEntryButton" type="button">직접 입력으로 계속</button>`;el.searchResults.classList.add("show")}}}
function chooseMedia(m){state.selectedMedia=m;el.titleInput.value=m.title||el.titleInput.value;clearResults();renderLinked();toast(m.source==="google-books"?"책 정보와 연결했습니다.":"작품 정보와 연결했습니다.")}
function metadata(m){if(!m)return{thumbnailUrl:null,tmdbTitle:null,originalTitle:null,releaseYear:null,overview:"",externalId:null,tmdbRating:null,tmdbVoteCount:null,ratingCapturedAt:null,creator:"",publisher:null,isbn:null,externalSource:null};if(m.source==="google-books")return{thumbnailUrl:m.posterUrl||null,tmdbTitle:null,originalTitle:null,releaseYear:m.year||null,overview:m.overview||"",externalId:m.id?`google_books_${m.id}`:null,tmdbRating:null,tmdbVoteCount:null,ratingCapturedAt:null,creator:m.creator||"",publisher:m.publisher||null,isbn:m.isbn||null,externalSource:"google-books"};const rt=Number(m.tmdbRating)>0?Number(m.tmdbRating):null,vc=Number(m.tmdbVoteCount)>0?Number(m.tmdbVoteCount):null;return{thumbnailUrl:m.posterUrl||null,tmdbTitle:m.title||null,originalTitle:m.originalTitle||null,releaseYear:m.year||null,overview:m.overview||"",externalId:m.id?`tmdb_${m.mediaType||"movie"}_${m.id}`:null,tmdbRating:rt,tmdbVoteCount:vc,ratingCapturedAt:rt&&vc?new Date().toISOString():null,creator:"",publisher:null,isbn:null,externalSource:null}}
function openRecord(opts={}){state.type="movie";state.rating=0;state.selectedMedia=null;state.editingWishlistId=opts.fromWishlist?.id||null;state.selectedDate=today();state.dateMode="today";el.titleInput.value=opts.fromWishlist?.title||"";el.noteInput.value=opts.fromWishlist?.note||"";el.unseenInput.checked=false;clearResults();renderForm();open(el.recordOverlay);setTimeout(()=>el.titleInput.focus(),200)}
async function saveRecord(){if(state.saving)return;const title=el.titleInput.value.trim(),wish=el.unseenInput.checked;if(!title){toast("제목을 입력해 주세요.");return}if(!wish&&!state.rating){toast("별점을 선택해 주세요.");return}state.saving=true;el.saveButton.disabled=true;try{const record={id:uid(),title,type:state.type,status:wish?"wishlist":"completed",rating:wish?null:state.rating,watchedAt:wish?null:state.selectedDate,note:el.noteInput.value.trim(),createdAt:new Date().toISOString(),...metadata(state.selectedMedia)};if(state.editingWishlistId&&!wish){const old=state.records.find(r=>r.id===state.editingWishlistId);if(old){record.id=old.id;record.createdAt=old.createdAt}}await put(record);state.records=await getAll();state.tab=wish?"wishlist":"completed";state.filter="all";renderTabs();renderFilters();renderRecords();close(el.recordOverlay);toast(wish?"보고 싶은 목록에 추가했습니다.":"본 것에 기록했습니다.")}catch(e){console.error(e);toast("저장 실패: iPhone 데이터베이스에 접근하지 못했습니다.")}finally{state.saving=false;el.saveButton.disabled=false}}
function renderEditStars(){el.recordEditRatingChoices.innerHTML=[1,2,3,4,5].map(n=>`<button class="star-button ${n<=state.editRating?"selected":""}" data-edit-rating="${n}" type="button">★</button>`).join("")}
function openRecordEdit(record){state.editingRecordId=record.id;state.editRating=Number(record.rating)||0;el.recordEditDateInput.value=record.watchedAt||today();el.recordEditNoteInput.value=record.note||"";renderEditStars();open(el.recordEditOverlay)}
async function saveRecordEdit(){const watchedAt=el.recordEditDateInput.value,record=state.records.find(r=>r.id===state.editingRecordId);if(!record){toast("수정할 기록을 찾지 못했습니다.");return}if(!state.editRating){toast("별점을 선택해 주세요.");return}if(!watchedAt){toast("감상일을 선택해 주세요.");return}el.saveRecordEditButton.disabled=true;try{record.rating=state.editRating;record.watchedAt=watchedAt;record.note=el.recordEditNoteInput.value.trim();await put(record);state.records=await getAll();renderRecords();const updated=state.records.find(r=>r.id===record.id);close(el.recordEditOverlay);if(updated)detail(updated);toast("기록을 수정했습니다.")}catch(e){console.error(e);toast("기록 수정에 실패했습니다.")}finally{el.saveRecordEditButton.disabled=false}}
function detail(r){const w=r.status==="wishlist",book=r.type==="book",meta=(book?[r.creator,r.releaseYear,w?"보고 싶은 목록":dateText(r.watchedAt)]:[typeInfo(r.type).label,r.releaseYear,w?"보고 싶은 목록":dateText(r.watchedAt)]).filter(Boolean).join(" · "),bg=r.thumbnailUrl?`style="background-image:url('${esc(r.thumbnailUrl)}')"`:"",tmdb=!book&&Number(r.tmdbRating)>0&&Number(r.tmdbVoteCount)>0;el.detailContent.innerHTML=`<div class="detail-hero"><div class="detail-backdrop" ${bg}></div><div class="detail-hero-content">${cover(r,"detail-cover")}<div><h2 class="detail-title">${esc(r.title)}</h2><p class="detail-meta">${esc(meta)}</p>${!book&&r.originalTitle?`<p class="detail-original">${esc(r.originalTitle)}</p>`:""}</div></div></div><div class="detail-body">${w?"":`<section class="detail-section"><h3>평가</h3><div class="ratings-grid"><div class="rating-box mine"><span class="rating-box-label">내 평가</span><span class="rating-box-value">${stars(r.rating)}<span class="rating-box-sub">${r.rating}/5</span></span></div>${tmdb?`<div class="rating-box"><span class="rating-box-label">TMDb 평가</span><span class="rating-box-value">${Number(r.tmdbRating).toFixed(1)} / 10<span class="rating-box-sub">${count(r.tmdbVoteCount)}명</span></span></div>`:""}</div></section>`}${r.note?`<section class="detail-section"><h3>${w?"메모":"내 감상"}</h3><p>${esc(r.note)}</p></section>`:""}${r.overview?`<section class="detail-section"><h3>${book?"책 소개":"작품 소개"}</h3><p>${esc(r.overview)}</p></section>`:""}${w?`<button class="detail-action" id="completeButton" data-id="${r.id}" type="button">감상 완료로 기록</button>`:`<button class="detail-date-edit" id="recordEditButton" data-id="${r.id}" type="button">기록 수정</button>`}</div>`;open(el.detailOverlay)}
async function refreshStatus(){try{const n=(await getAll()).length;el.storageStatus.textContent=`이 iPhone의 IndexedDB에 ${n}개 기록이 저장되어 있습니다.`}catch{el.storageStatus.textContent="이 iPhone의 저장소 상태를 확인할 수 없습니다."}}

el.recordList.addEventListener("click",async e=>{const d=e.target.closest("[data-delete]");if(d){const r=state.records.find(x=>x.id===d.dataset.delete);if(!r||!confirm(`“${r.title}” 기록을 삭제하시겠습니까?`))return;try{await remove(r.id);state.records=await getAll();renderRecords();toast("기록을 삭제했습니다.")}catch{toast("삭제에 실패했습니다.")}return}const c=e.target.closest("[data-id]");if(c){const r=state.records.find(x=>x.id===c.dataset.id);if(r)detail(r)}});el.detailContent.addEventListener("click",e=>{const completeButton=e.target.closest("#completeButton");if(completeButton){const r=state.records.find(x=>x.id===completeButton.dataset.id);if(r){close(el.detailOverlay);openRecord({fromWishlist:r})}return}const recordEditButton=e.target.closest("#recordEditButton");if(recordEditButton){const r=state.records.find(x=>x.id===recordEditButton.dataset.id);if(r)openRecordEdit(r)}});el.exportButton.onclick=async()=>{try{const records=await getAll(),blob=new Blob([JSON.stringify({app:"Seen",version:"indexeddb-books-v1",exportedAt:new Date().toISOString(),records},null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=`Seen-backup-${today()}.json`;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);toast("백업 파일을 만들었습니다.")}catch{toast("백업 생성에 실패했습니다.")}};el.importButton.onclick=()=>el.importInput.click();el.importInput.onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text()),list=Array.isArray(data)?data:data.records;if(!Array.isArray(list))throw Error();if(!confirm(`${list.length}개의 기록으로 현재 데이터를 교체하시겠습니까?`))return;await replaceAll(list);state.records=await getAll();renderRecords();close(el.settingsOverlay);toast(`${state.records.length}개 기록을 복원했습니다.`)}catch{toast("백업 파일을 읽지 못했습니다.")}finally{e.target.value=""}};el.clearButton.onclick=async()=>{if(!state.records.length)return toast("삭제할 기록이 없습니다.");if(!confirm("정말 모든 Seen 기록을 삭제하시겠습니까?"))return;try{await clearDb();state.r
