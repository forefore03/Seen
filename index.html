<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f7f4" />
  <title>Seen</title>
  <style>
    :root {
      --bg: #f7f7f4;
      --surface: #ffffff;
      --surface-soft: #f0f0eb;
      --text: #1c1c1a;
      --muted: #77776f;
      --line: #e7e7df;
      --accent: #2d4d3a;
      --accent-soft: #e4eee6;
      --star: #f1ae2b;
      --danger: #b3261e;
      --shadow: 0 12px 35px rgba(25, 29, 24, 0.10);
    }

    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      margin: 0;
      min-width: 320px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    .app-shell {
      max-width: 680px;
      min-height: 100dvh;
      margin: 0 auto;
      padding: calc(18px + env(safe-area-inset-top)) 20px calc(100px + env(safe-area-inset-bottom));
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand {
      margin: 0;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -1.8px;
    }
    .icon-button {
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 14px;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      font-size: 22px;
      box-shadow: 0 2px 8px rgba(25, 29, 24, .05);
    }
    .hero { margin: 28px 0 18px; }
    .eyebrow {
      margin: 0 0 6px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .hero h2 { margin: 0; font-size: 24px; letter-spacing: -1px; }

    .filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 0 18px;
      scrollbar-width: none;
    }
    .filters::-webkit-scrollbar { display: none; }
    .filter-button {
      flex: 0 0 auto;
      min-height: 36px;
      padding: 0 14px;
      border: 1px solid transparent;
      border-radius: 99px;
      background: var(--surface-soft);
      color: var(--muted);
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
    }
    .filter-button.active { background: var(--accent); color: #fff; }

    #recordList { display: grid; gap: 10px; }
    .record-card {
      display: grid;
      grid-template-columns: 48px 1fr auto;
      gap: 13px;
      align-items: center;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: 0 2px 8px rgba(25, 29, 24, .03);
    }
    .type-badge {
      display: grid;
      width: 48px;
      height: 48px;
      place-items: center;
      border-radius: 14px;
      background: var(--accent-soft);
      font-size: 22px;
    }
    .record-main { min-width: 0; }
    .record-title {
      overflow: hidden;
      margin: 0;
      font-size: 16px;
      font-weight: 800;
      line-height: 1.3;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .record-meta { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
    .record-rating { margin: 5px 0 0; color: var(--star); font-size: 15px; letter-spacing: 1px; }
    .delete-button {
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: #a2a29c;
      cursor: pointer;
      font-size: 17px;
    }
    .delete-button:active { background: #f5e7e5; color: var(--danger); }

    .empty-state {
      padding: 42px 24px;
      border: 1px dashed #cfcec5;
      border-radius: 20px;
      color: var(--muted);
      text-align: center;
    }
    .empty-state .empty-icon { display: block; margin-bottom: 12px; font-size: 34px; }
    .empty-state h3 { margin: 0 0 7px; color: var(--text); font-size: 17px; }
    .empty-state p { margin: 0; font-size: 14px; line-height: 1.6; }

    .add-button {
      position: fixed;
      right: 20px;
      bottom: calc(20px + env(safe-area-inset-bottom));
      left: 20px;
      z-index: 5;
      max-width: 640px;
      min-height: 56px;
      margin: 0 auto;
      border: 0;
      border-radius: 18px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 10px 28px rgba(45, 77, 58, .28);
      font-size: 16px;
      font-weight: 800;
    }
    .add-button:active { transform: scale(.99); }

    .overlay {
      position: fixed;
      z-index: 20;
      inset: 0;
      display: flex;
      align-items: flex-end;
      background: rgba(18, 20, 18, .38);
      opacity: 0;
      pointer-events: none;
      transition: opacity .22s ease;
    }
    .overlay.show { opacity: 1; pointer-events: auto; }
    .sheet {
      width: min(680px, 100%);
      max-height: min(88dvh, 760px);
      margin: 0 auto;
      padding: 12px 20px calc(24px + env(safe-area-inset-bottom));
      overflow-y: auto;
      border-radius: 26px 26px 0 0;
      background: var(--surface);
      transform: translateY(100%);
      transition: transform .28s cubic-bezier(.2,.8,.2,1);
    }
    .overlay.show .sheet { transform: translateY(0); }
    .handle { width: 38px; height: 4px; margin: 0 auto 15px; border-radius: 999px; background: #d3d3cd; }
    .sheet-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
    .sheet-title { margin: 0; font-size: 22px; letter-spacing: -1px; }
    .close-button { width: 36px; height: 36px; border: 0; border-radius: 50%; background: var(--surface-soft); cursor: pointer; font-size: 20px; }
    .field { margin-bottom: 22px; }
    .field label { display: block; margin-bottom: 9px; font-size: 14px; font-weight: 800; }
    .text-input, .date-input {
      width: 100%;
      min-height: 50px;
      padding: 0 14px;
      border: 1px solid #d9d9d1;
      border-radius: 14px;
      outline: none;
      background: #fff;
      color: var(--text);
      font-size: 16px;
    }
    .text-input:focus, .date-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(45, 77, 58, .12); }
    .type-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
    .type-choice {
      min-height: 48px;
      padding: 5px 3px;
      border: 1px solid #dcdcd5;
      border-radius: 12px;
      background: #fff;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
    }
    .type-choice.selected { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
    .rating-row { display: flex; gap: 4px; }
    .star-button {
      width: 48px;
      height: 48px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #d7d7cf;
      cursor: pointer;
      font-size: 32px;
      line-height: 1;
    }
    .star-button.selected { color: var(--star); }
    .save-button {
      width: 100%;
      min-height: 56px;
      border: 0;
      border-radius: 16px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font-size: 16px;
      font-weight: 800;
    }
    .save-button:disabled { background: #bfc6bf; cursor: not-allowed; }

    .settings-panel { padding-bottom: 8px; }
    .settings-copy { margin: -8px 0 22px; color: var(--muted); font-size: 14px; line-height: 1.55; }
    .settings-button {
      display: flex;
      width: 100%;
      min-height: 54px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      padding: 0 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      color: var(--text);
      cursor: pointer;
      text-align: left;
      font-size: 15px;
      font-weight: 750;
    }
    .settings-button.danger { color: var(--danger); }
    #importInput { display: none; }
    .toast {
      position: fixed;
      z-index: 50;
      bottom: calc(92px + env(safe-area-inset-bottom));
      left: 50%;
      padding: 12px 16px;
      border-radius: 12px;
      background: #272a27;
      color: #fff;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 12px);
      transition: opacity .2s ease, transform .2s ease;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (min-width: 700px) {
      .add-button { right: auto; left: 50%; width: 640px; transform: translateX(-50%); }
      .add-button:active { transform: translateX(-50%) scale(.99); }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <h1 class="brand">Seen</h1>
      <button class="icon-button" id="settingsButton" type="button" aria-label="설정">⚙︎</button>
    </header>

    <section class="hero">
      <p class="eyebrow">Personal content history</p>
      <h2>내가 본 것들</h2>
    </section>

    <nav class="filters" id="filters" aria-label="콘텐츠 유형 필터"></nav>
    <section id="recordList" aria-live="polite"></section>
  </main>

  <button class="add-button" id="openAddButton" type="button">＋ 새 기록 추가</button>

  <div class="overlay" id="recordOverlay" aria-hidden="true">
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="recordSheetTitle">
      <div class="handle"></div>
      <header class="sheet-header">
        <h2 class="sheet-title" id="recordSheetTitle">새 기록</h2>
        <button class="close-button" id="closeRecordButton" type="button" aria-label="닫기">×</button>
      </header>
      <form id="recordForm">
        <div class="field">
          <label for="titleInput">무엇을 보셨나요?</label>
          <input class="text-input" id="titleInput" name="title" type="text" maxlength="120" autocomplete="off" placeholder="제목을 입력하세요" required />
        </div>
        <div class="field">
          <label>유형</label>
          <div class="type-grid" id="typeChoices"></div>
        </div>
        <div class="field">
          <label>내 평점</label>
          <div class="rating-row" id="ratingChoices" aria-label="별점 선택"></div>
        </div>
        <div class="field">
          <label for="watchedAtInput">감상일</label>
          <input class="date-input" id="watchedAtInput" name="watchedAt" type="date" required />
        </div>
        <button class="save-button" id="saveButton" type="submit" disabled>기록 저장</button>
      </form>
    </section>
  </div>

  <div class="overlay" id="settingsOverlay" aria-hidden="true">
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="settingsSheetTitle">
      <div class="handle"></div>
      <header class="sheet-header">
        <h2 class="sheet-title" id="settingsSheetTitle">설정</h2>
        <button class="close-button" id="closeSettingsButton" type="button" aria-label="닫기">×</button>
      </header>
      <div class="settings-panel">
        <p class="settings-copy">Seen의 기록은 현재 이 iPhone 브라우저에 저장됩니다. 중요한 기록은 정기적으로 백업해 주세요.</p>
        <button class="settings-button" id="exportButton" type="button"><span>기록 내보내기</span><span>↓</span></button>
        <button class="settings-button" id="importButton" type="button"><span>백업 파일에서 복원</span><span>↑</span></button>
        <input id="importInput" type="file" accept="application/json,.json" />
        <button class="settings-button danger" id="clearButton" type="button"><span>모든 기록 삭제</span><span>×</span></button>
      </div>
    </section>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script>
    const STORAGE_KEY = "seen.records.v1";
    const TYPES = [
      { id: "all", label: "전체", icon: "◌" },
      { id: "movie", label: "영화", icon: "🎬" },
      { id: "series", label: "시리즈", icon: "📺" },
      { id: "book", label: "책", icon: "📚" },
      { id: "animation", label: "애니", icon: "✨" },
      { id: "documentary", label: "다큐", icon: "🌍" }
    ];

    const state = { filter: "all", type: "movie", rating: 0, records: loadRecords() };

    const elements = {
      filters: document.getElementById("filters"),
      recordList: document.getElementById("recordList"),
      recordOverlay: document.getElementById("recordOverlay"),
      settingsOverlay: document.getElementById("settingsOverlay"),
      openAddButton: document.getElementById("openAddButton"),
      closeRecordButton: document.getElementById("closeRecordButton"),
      settingsButton: document.getElementById("settingsButton"),
      closeSettingsButton: document.getElementById("closeSettingsButton"),
      recordForm: document.getElementById("recordForm"),
      titleInput: document.getElementById("titleInput"),
      watchedAtInput: document.getElementById("watchedAtInput"),
      typeChoices: document.getElementById("typeChoices"),
      ratingChoices: document.getElementById("ratingChoices"),
      saveButton: document.getElementById("saveButton"),
      exportButton: document.getElementById("exportButton"),
      importButton: document.getElementById("importButton"),
      importInput: document.getElementById("importInput"),
      clearButton: document.getElementById("clearButton"),
      toast: document.getElementById("toast")
    };

    function loadRecords() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        return Array.isArray(saved) ? saved : [];
      } catch {
        return [];
      }
    }

    function saveRecords() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.records));
    }

    function typeInfo(id) {
      return TYPES.find(type => type.id === id) || TYPES[0];
    }

    function todayString() {
      const now = new Date();
      const offset = now.getTimezoneOffset();
      return new Date(now.getTime() - offset * 60000).toISOString().slice(0, 10);
    }

    function formatDate(value) {
      const [year, month, day] = value.split("-").map(Number);
      const date = new Date(year, month - 1, day);
      const today = new Date();
      const todayLocal = new Date(today.getFullYear(), today.getMonth(), today.getDate());
      const target = new Date(year, month - 1, day);
      const diff = Math.round((todayLocal - target) / 86400000);
      if (diff === 0) return "오늘";
      if (diff === 1) return "어제";
      return `${year}. ${String(month).padStart(2, "0")}. ${String(day).padStart(2, "0")}`;
    }

    function starText(rating) {
      return "★".repeat(rating) + "☆".repeat(5 - rating);
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;"
      })[char]);
    }

    function renderFilters() {
      elements.filters.innerHTML = TYPES.map(type => `
        <button class="filter-button ${state.filter === type.id ? "active" : ""}" type="button" data-filter="${type.id}">${type.label}</button>
      `).join("");
    }

    function renderRecords() {
      const list = state.records
        .filter(record => state.filter === "all" || record.type === state.filter)
        .sort((a, b) => b.watchedAt.localeCompare(a.watchedAt) || b.createdAt.localeCompare(a.createdAt));

      if (!list.length) {
        const message = state.filter === "all" ? "첫 기록을 남겨 보세요." : `${typeInfo(state.filter).label} 기록이 아직 없습니다.`;
        elements.recordList.innerHTML = `
          <div class="empty-state">
            <span class="empty-icon">✦</span>
            <h3>아직 기록이 없습니다</h3>
            <p>${message}<br />별점 하나로 충분합니다.</p>
          </div>
        `;
        return;
      }

      elements.recordList.innerHTML = list.map(record => {
        const info = typeInfo(record.type);
        return `
          <article class="record-card">
            <div class="type-badge" aria-hidden="true">${info.icon}</div>
            <div class="record-main">
              <h3 class="record-title">${escapeHtml(record.title)}</h3>
              <p class="record-meta">${info.label} · ${formatDate(record.watchedAt)}</p>
              <p class="record-rating" aria-label="${record.rating}점">${starText(record.rating)}</p>
            </div>
            <button class="delete-button" type="button" data-delete-id="${record.id}" aria-label="${escapeHtml(record.title)} 기록 삭제">⌫</button>
          </article>
        `;
      }).join("");
    }

    function renderFormOptions() {
      elements.typeChoices.innerHTML = TYPES.filter(type => type.id !== "all").map(type => `
        <button class="type-choice ${state.type === type.id ? "selected" : ""}" type="button" data-type="${type.id}">${type.label}</button>
      `).join("");
      elements.ratingChoices.innerHTML = [1, 2, 3, 4, 5].map(value => `
        <button class="star-button ${value <= state.rating ? "selected" : ""}" type="button" data-rating="${value}" aria-label="${value}점">★</button>
      `).join("");
      validateForm();
    }

    function validateForm() {
      elements.saveButton.disabled = !(elements.titleInput.value.trim() && state.rating > 0);
    }

    function openOverlay(overlay) {
      overlay.classList.add("show");
      overlay.setAttribute("aria-hidden", "false");
    }

    function closeOverlay(overlay) {
      overlay.classList.remove("show");
      overlay.setAttribute("aria-hidden", "true");
    }

    function openRecordSheet() {
      state.type = "movie";
      state.rating = 0;
      elements.recordForm.reset();
      elements.watchedAtInput.value = todayString();
      renderFormOptions();
      openOverlay(elements.recordOverlay);
      setTimeout(() => elements.titleInput.focus(), 260);
    }

    function showToast(message) {
      elements.toast.textContent = message;
      elements.toast.classList.add("show");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => elements.toast.classList.remove("show"), 1900);
    }

    function createId() {
      return window.crypto?.randomUUID ? crypto.randomUUID() : `seen_${Date.now()}_${Math.random().toString(16).slice(2)}`;
    }

    elements.openAddButton.addEventListener("click", openRecordSheet);
    elements.closeRecordButton.addEventListener("click", () => closeOverlay(elements.recordOverlay));
    elements.settingsButton.addEventListener("click", () => openOverlay(elements.settingsOverlay));
    elements.closeSettingsButton.addEventListener("click", () => closeOverlay(elements.settingsOverlay));

    [elements.recordOverlay, elements.settingsOverlay].forEach(overlay => {
      overlay.addEventListener("click", event => {
        if (event.target === overlay) closeOverlay(overlay);
      });
    });

    elements.filters.addEventListener("click", event => {
      const button = event.target.closest("[data-filter]");
      if (!button) return;
      state.filter = button.dataset.filter;
      renderFilters();
      renderRecords();
    });

    elements.typeChoices.addEventListener("click", event => {
      const button = event.target.closest("[data-type]");
      if (!button) return;
      state.type = button.dataset.type;
      renderFormOptions();
    });

    elements.ratingChoices.addEventListener("click", event => {
      const button = event.target.closest("[data-rating]");
      if (!button) return;
      state.rating = Number(button.dataset.rating);
      renderFormOptions();
    });

    elements.titleInput.addEventListener("input", validateForm);

    elements.recordForm.addEventListener("submit", event => {
      event.preventDefault();
      const title = elements.titleInput.value.trim();
      if (!title || !state.rating) return;
      state.records.push({
        id: createId(),
        title,
        type: state.type,
        rating: state.rating,
        watchedAt: elements.watchedAtInput.value || todayString(),
        createdAt: new Date().toISOString()
      });
      saveRecords();
      state.filter = "all";
      renderFilters();
      renderRecords();
      closeOverlay(elements.recordOverlay);
      showToast("기록했습니다.");
    });

    elements.recordList.addEventListener("click", event => {
      const button = event.target.closest("[data-delete-id]");
      if (!button) return;
      const record = state.records.find(item => item.id === button.dataset.deleteId);
      if (!record) return;
      if (!window.confirm(`“${record.title}” 기록을 삭제하시겠습니까?`)) return;
      state.records = state.records.filter(item => item.id !== record.id);
      saveRecords();
      renderRecords();
      showToast("기록을 삭제했습니다.");
    });

    elements.exportButton.addEventListener("click", () => {
      const backup = {
        app: "Seen",
        version: 1,
        exportedAt: new Date().toISOString(),
        records: state.records
      };
      const blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `Seen-backup-${todayString()}.json`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
      showToast("백업 파일을 만들었습니다.");
    });

    elements.importButton.addEventListener("click", () => elements.importInput.click());
    elements.importInput.addEventListener("change", async event => {
      const file = event.target.files?.[0];
      if (!file) return;
      try {
        const content = JSON.parse(await file.text());
        const incoming = Array.isArray(content) ? content : content.records;
        if (!Array.isArray(incoming)) throw new Error("invalid");
        const valid = incoming.filter(record => record && record.id && record.title && record.type && Number(record.rating) > 0 && record.watchedAt);
        if (!window.confirm(`${valid.length}개의 기록으로 현재 Seen 데이터를 교체하시겠습니까?`)) return;
        state.records = valid;
        saveRecords();
        state.filter = "all";
        renderFilters();
        renderRecords();
        closeOverlay(elements.settingsOverlay);
        showToast(`${valid.length}개 기록을 복원했습니다.`);
      } catch {
        window.alert("Seen 백업 JSON 파일을 읽지 못했습니다.");
      } finally {
        event.target.value = "";
      }
    });

    elements.clearButton.addEventListener("click", () => {
      if (!state.records.length) return showToast("삭제할 기록이 없습니다.");
      if (!window.confirm("정말 모든 Seen 기록을 삭제하시겠습니까? 이 작업은 되돌릴 수 없습니다.")) return;
      state.records = [];
      saveRecords();
      renderRecords();
      closeOverlay(elements.settingsOverlay);
      showToast("모든 기록을 삭제했습니다.");
    });

    document.addEventListener("keydown", event => {
      if (event.key !== "Escape") return;
      closeOverlay(elements.recordOverlay);
      closeOverlay(elements.settingsOverlay);
    });

    renderFilters();
    renderRecords();
    renderFormOptions();
  </script>
</body>
</html>
