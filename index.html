const state={db:null,tab:"completed",filter:"all",type:"movie",rating:0,selectedMedia:null,editingWishlistId:null,editingRecordId:null,editRating:0,editType:"movie",editSelectedMedia:null,editSearchAbort:null,records:[],searchTimer:null,searchAbort:null,saving:false,selectedDate:"",dateMode:"today",librarySearchOpen:false,libraryQuery:"",sortCompleted:"recent",sortWishlist:"recent",pendingRestore:null,recommendation:null,recommendationLoading:false};

tton"),detailContent:$("detailContent"),exportButton:$("exportButton"),importButton:$("importButton"),importInput:$("importInput"),clearButton:$("clearButton"),storageStatus:$("storageStatus"),restoreOverlay:$("restoreOverlay"),closeRestoreButton:$("closeRestoreButton"),restoreFileName:$("restoreFileName"),restoreDate:$("restoreDate"),restoreTotal:$("restoreTotal"),restoreCompleted:$("restoreCompleted"),restoreWishlist:$("restoreWishlist"),restoreWarning:$("restoreWarning"),confirmRestoreButton:$("confirmRestoreButton"),cancelRestoreButton:$("cancelRestoreButton"),recommendButton:$("recommendButton"),recommendOverlay:$("recommendOverlay"),closeRecommendButton:$("closeRecommendButton"),recommendContent:$("recommendContent"),toast:$("toast")};
function uid(){return"seen_"+Date.now()+"_"+Math.random().toString(36).slice(2,10)}
function normalize(r){return{id:String(r.id||uid()),title:String(r.title||""),type:r.type||"movie",status:r.status||"completed",rating:r.rating==null?null:Number(r.rating),watchedAt:r.watchedAt||null,note:String(r.note||""),thumbnailUrl:r.thumbnailUrl||null,tmdbTitle:r.tmdbTitle||null,originalTitle:r.originalTitle||null,releaseYear:r.releaseYear||null,overview:String(r.overview||""),externalId:r.externalId||null,tmdbRating:Number(r.tmdbRating)>0?Number(r.tmdbRating):null,tmdbVoteCount:Number(r.tmdbVoteCount)>0?Number(r.tmdbVoteCount):null,ratingCapturedAt:r.ratingCapturedAt||null,creator:String(r.creator||""),publisher:r.publisher||null,isbn:r.isbn||null,externalSource:r.externalSource||null,createdAt:r.createdAt||new Date().toISOString()}}
function openDb(){return new Promise((resolve,reject)=>{if(!window.indexedDB){reject(new Error("IndexedDB를 지원하지 않는 브라우저입니다"));return}const req=indexedDB.open(DB_NAME,DB_VERSION);req.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains(STORE_NAME))db.createObjectStore(STORE_NAME,{keyPath:"id"})};req.onsuccess=e=>resolve(e.target.result);req.onerror=()=>reject(req.error||new Error("데이터베이스를 열 수 없습니다"))})}

function replaceAll(records){return new Promise((resolve,reject)=>{const tx=state.db.transaction(STORE_NAME,"readwrite"),store=tx.objectStore(STORE_NAME);store.clear();records.forEach(r=>store.put(normalize(r)));tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error)})}
function today(){const d=new Date(),o=d.getTimezoneOffset();return new Date(d.getTime()-o*60000).toISOString().slice(0,10)}function yesterday(){const d=new Date();d.setDate(d.getDate()-1);const o=d.getTimezoneOffset();return new Date(d.getTime()-o*60000).toISOString().slice(0,10)}function dateText(v){if(!v)return"";const[y,m,d]=v.split("-").map(Number),now=new Date(),a=new Date(now.getFullYear(),now.getMonth(),now.getDate()),b=new Date(y,m-1,d),diff=Math.round((a-b)/86400000);if(diff===0)return`오늘 · ${y}.${String(m).padStart(2,"0")}.${String(d).padStart(2,"0")}`;if(diff===1)return`어제 · ${y}.${String(m).padStart(2,"0")}.${String(d).padStart(2,"0")}`;return`${y}. ${String(m).padStart(2,"0")}. ${String(d).padStart(2,"0")}`}function typeInfo(id){return TYPES.find(t=>t.id===id)||TYPES[0]}function stars(n){return"★".repeat(n||0)+"☆".repeat(5-(n||0))}function esc(v){return String(v||"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"})[c])}function count(n){return new Intl.NumberFormat("ko-KR").format(Number(n||0))}function toast(m){el.toast.textContent=m;el.toast.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>el.toast.classList.remove("show"),2400)}function syncModalBackdrop(){document.getElementById("modalBackdrop").classList.toggle("show",!!document.querySelector(".overlay.show"))}function open(o){o.classList.add("show");syncModalBackdrop()}function close(o){o.classList.remove("show");syncModalBackdrop()}function cover(r,c="cover"){return`<div class="${c}">${r.thumbnailUrl?`<img src="${esc(r.thumbnailUrl)}" alt="">`:typeInfo(r.type).icon}</div>`}

function tmdbMovieId(record){const match=/^tmdb_movie_(\d+)$/.exec(String(record?.externalId||""));return match?Number(match[1]):null}
function recommendationIds(){const excluded=[...new Set(state.records.map(tmdbMovieId).filter(Boolean))],liked=[...new Set(state.records.filter(r=>r.status==="completed"&&r.type==="movie"&&Number(r.rating)>=4&&Number(r.rating)<=5).map(tmdbMovieId).filter(Boolean))];return{liked,excluded}}

function renderTabs(){document.querySelectorAll(".main-tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===state.tab))}function renderFilters(){el.filters.innerHTML=TYPES.map(t=>`<button class="filter-button ${state.filter===t.id?"active":""}" data-filter="${t.id}" type="button">${t.label}</button>`).join("")}function libraryMatch(r){const q=state.libraryQuery.trim().toLocaleLowerCase("ko-KR");if(!q)return true;return[r.title,r.creator,r.note].some(v=>String(v||"").toLocaleLowerCase("ko-KR").includes(q))}function currentSort(){return state.tab==="completed"?state.sortCompleted:state.sortWishlist}function sortLabel(){const s=currentSort();if(state.tab==="wishlist")return s==="oldest"?"오래된 추가순":"최근 추가순";return({recent:"최신 감상순",oldest:"오래된 감상순",ratingHigh:"별점 높은순",ratingLow:"별점 낮은순"})[s]||"최신 감상순"}function sortRecords(list){const s=currentSort();return list.sort((a,b)=>{if(state.tab==="wishlist")return s==="oldest"?String(a.createdAt).localeCompare(String(b.createdAt)):String(b.createdAt).localeCompare(String(a.createdAt));if(s==="oldest")return String(a.watchedAt||"").localeCompare(String(b.watchedAt||""));if(s==="ratingHigh")return(Number(b.rating||0)-Number(a.rating||0))||String(b.watchedAt||"").localeCompare(String(a.watchedAt||""));if(s==="ratingLow")return(Number(a.rating||0)-Number(b.rating||0))||String(b.watchedAt||"").localeCompare(String(a.watchedAt||""));return String(b.watchedAt||"").localeCompare(String(a.watchedAt||""))})}function renderSortSummary(n){el.recordCount.textContent=`총 ${n}개의 기록`;el.sortSummaryButton.textContent=sortLabel();el.sortSummaryButton.setAttribute("aria-label",`현재 ${sortLabel()}. 정렬 방식 변경`)}function renderSortOptions(){const completed=[["recent","최신 감상순","가장 최근에 본 순서로 정렬됩니다."],["oldest","오래된 감상순","가장 먼저 본 순서로 정렬됩니다."],["ratingHigh","별점 높은순","내 별점이 높은 순서로 정렬됩니다."],["ratingLow","별점 낮은순","내 별점이 낮은 순서로 정렬됩니다."]],wishlist=[["recent","최근 추가순","가장 최근에 저장한 순서로 정렬됩니다."],["oldest","오래된 추가순","가장 먼저 저장한 순서로 정렬됩니다."]],items=state.tab===" function renderTypes(){el.typeChoices.innerHTML=TYPES.filter(t=>t.id!=="all").map(t=>`<button class="type-choice ${state.type===t.id?"selected":""}" data-type="${t.id}" type="button">${t.label}</button>`).join("")}function renderStars(){el.ratingChoices.innerHTML=[1,2,3,4,5].map(n=>`<button class="star-button ${n<=state.rating?"selected":""}" data-rating="${n}" type="button">★</button>`).join("")}function renderDateChoices(){el.watchedAtInput.value=state.selectedDate||today()}function updateMode(){const w=el.unseenInput.checked;el.titleLabel.textContent=w?"무엇을 기록하시나요?":"무엇을 보셨나요?";el.unseenHelp.textContent=w?"별점 없이 보고 싶은 목록에 저장됩니다.":"켜면 보고 싶은 목록에 저장됩니다.";el.ratingField.classList.toggle("hidden",w);el.dateField.classList.toggle("hidden",w);el.noteLabel.innerHTML=w?"메모 <span style='color:#77776f;font-weight:600'>· 선택</span>":"한 줄 감상 <span style='color:#77776f;font-weight:600'>· 선택</span>";el.noteHint.textContent=w?"왜 저장했는지 또는 언제 볼지 가볍게 남겨 보세요.":"나중의 나에게 남기는 짧은 메모입니다.";el.saveButton.textContent=w?"Add to Queue":state.editingWishlistId?"감상 완료로 저장":"기록 저장"}function renderLinked(){if(!state.selectedMedia){el.linkedWork.classList.remove("show");return}el.linkedWork.classList.add("show");const label=state.selectedMedia.source==="google-books"?"Google Books":"TMDb";const info=state.selectedMedia.source==="google-books"?state.selectedMedia.creator:state.selectedMedia.year;el.linkedWork.querySelector("span").textContent=`✓ ${label} 연결됨 · ${state.selectedMedia.title}${info?` · ${info}`:""}`}function renderForm(){renderTypes();renderStars();renderDateChoices();updateMode();renderLinked()}
function clearResults(){clearTimeout(state.searchTimer);if(state.searchAbort)state.searchAbort.abort();state.searchAbort=null;el.searchStatus.textContent="";el.searchResults.classList.remove("show");el.searchResults.innerHTML="";el.searchResults._items=[]}function isBook(){return state.type==="book"}function canTmdbSearch(){return["movie","series","animation","documentary"].includes(state.type)}function startSearch(){clearResults();state.selectedMedia=null;renderLinked();const q=el.titleInput.value.trim();if(q.length<2)return;state.searchTimer=setTimeout(()=>isBook()?searchGoogleBooks(q):searchTmdb(q),450)}

function renderEditLinkStatus(){const record=currentEditRecord(),m=state.editSelectedMedia,connected=!!m||!!record?.externalId;if(connected){el.recordEditLinkStatus.classList.add("connected");if(m){const info=m.source==="google-books"?(m.creator||m.year):(m.year||m.originalTitle);el.recordEditLinkText.textContent=`새 ${m.source==="google-books"?"Google Books":"TMDb"} 정보 선택됨 · ${m.title}${info?` · ${info}`:""}`}else{const label=record?.externalSource==="google-books"?"Google Books":record?.externalId?.startsWith("tmdb_")?"TMDb":"작품 정보";el.recordEditLinkText.textContent=`현재 ${label}에 연결되어 있습니다.`}}else{el.recordEditLinkStatus.classList.remove("connected");el.recordEditLinkText.textContent="작품 정보가 연결되어 있지 않습니다."}el.recordEditSearchButton.textContent=`${editSourceLabel()}에서 작품 찾기`}
function renderEditForm(){renderEditTypes();renderEditStars();renderEditLinkStatus()}
async function searchEditMetadata(){const q=el.recordEditTitleInput.value.trim();clearEditSearch();if(q.length<2){toast("검색할 제목을 2글자 이상 입력해 주세요.");return}try{state.editSearchAbort=new AbortController();const isBook=state.editType==="book";el.recordEditSearchStatus.textContent=isBook?"Google Books 검색 중…":"TMDb 검색 중…";const res=await fetch(`${WORKER_URL}/search?q=${encodeURIComponent(q)}&type=${encodeURIComponent(state.editType)}`,{signal:state.editSearchAbort.signal});if(!res.ok)throw Error();const data=await res.json(),items=Array.isArray(data.results)?data.results:[];el.recordEditSearchResults._items=items;if(!items.length){el.recordEditSearchStatus.textContent="검색 결과가 없습니다. 제목이나 유형을 확인해 주세요.";return}el.recordEditSearchStatus.textContent=isBook?"책을 선택하면 표지와 책 정보가 연결됩니다.":"작품을 선택하면 포스터와 정보가 연결됩니다.";el.recordEditSearchResults.innerHTML=items.map((r,i)=>{if(isBook)return`<button class="search-result" data-edit-result="${i}" type="button"><span class="search-result-cover">${r.posterUrl?`<img src="${esc(r.posterUrl)}" alt="">`:"📚"}</span><span class="search-result-copy"><span class="search-result-title">${esc(r.title)}</span><span class="search-result-author">${esc(r.creator||"저자 정보 없음")}${r.year?` · ${esc(r.year)}`:""}</span></span></button>`;const rating=Number(r.tmdbRating)>0&&Number(r.tmdbVoteCount)>0?`<span class="result-rating">TMDb ${Number(r.tmdbRating).toFixed(1)} · ${count(r.tmdbVoteCount)}명</span>`:"";return`<button class="search-result" data-edit-result="${i}" type="button"><span class="search-result-cover">${r.posterUrl?`<img src="${esc(r.posterUrl)}" alt="">`:(r.mediaType==="tv"?"📺":"🎬")}</span><span class="search-result-copy"><span class="search-result-title">${esc(r.title)}</span><span class="search-result-meta">${esc(r.originalTitle||"")}${r.year?` · ${r.year}`:""}</span>${rating}</span></button>`}).join("");el.recordEditSearchResults.classList.add("show")}catch(e){if(e.name!=="AbortError"){console.error(e);el.recordEditSearchStatus.textContent="검색에 실패했습니다. 잠시 후 다시 시도해 주세요."}}}
function chooseEditMedia(m){state.editSelectedMedia=m;el.recordEditTitleInput.value=m.title||el.recordEditTitleInput.value;clearEditSearch();renderEditLinkStatus();toast(m.source==="google-books"?"책 정보를 선택했습니다.":"TMDb 작품 정보를 선택했습니다.")}
function openRecordEdit(record){state.editingRecordId=record.id;state.editRating=Number(record.rating)||0;state.editType=record.type||"movie";state.editSelectedMedia=null;el.recordEditTitleInput.value=record.title||"";el.recordEditDateInput.value=record.watchedAt||today();el.recordEditNoteInput.value=record.note||"";clearEditSearch();renderEditForm();open(el.recordEditOverlay)}
async function saveRecordEdit(){const record=currentEditRecord(),title=el.recordEditTitleInput.value.trim(),watchedAt=el.recordEditDateInput.value;if(!record){toast("수정할 기록을 찾지 못했습니다.");return}if(!title){toast("제목을 입력해 주세요.");return}if(!state.editRating){toast("별점을 선택해 주세요.");return}if(!watchedAt){toast("감상일을 선택해 주세요.");return}el.saveRecordEditButton.disabled=true;try{record.title=title;record.type=state.editType;record.rating=state.editRating;record.watchedAt=watchedAt;record.note=el.recordEditNoteInput.value.trim();if(state.editSelectedMedia){Object.assign(record,metadata(state.editSelectedMedia));record.title=el.recordEditTitleInput.value.trim()}await put(record);state.records=await getAll();renderRecords();const updated=state.records.find(r=>r.id===record.id);close(el.recordEditOverlay);if(updated)detail(updated);toast(state.editSelectedMedia?"기록과 작품 정보를 수정했습니다.":"기록을 수정했습니다.")}catch(e){console.error(e);toast("기록 수정에 실패했습니다.")}finally{el.saveRecordEditButton.disabled=false}}
function detail(r){const w=r.status==="wishlist",book=r.type==="book",meta=(book?[r.creator,r.releaseYear,w?"보고 싶은 목록":dateText(r.watchedAt)]:[typeInfo(r.type).label,r.releaseYear,w?"보고 싶은 목록":dateText(r.watchedAt)]).filter(Boolean).join(" · "),bg=r.thumbnailUrl?`style="background-image:url('${esc(r.thumbnailUrl)}')"`:"",tmdb=!book&&Number(r.tmdbRating)>0&&Number(r.tmdbVoteCount)>0;el.detailContent.innerHTML=`<div class="detail-hero"><div class="detail-backdrop" ${bg}></div><div class="detail-hero-content">${cover(r,"detail-cover")}<div><h2 class="detail-title">${esc(r.title)}</h2><p class="detail-meta">${esc(meta)}</p>${!book&&r.originalTitle?`<p class="detail-original">${esc(r.originalTitle)}</p>`:""}</div></div></div><div class="detail-body">${w?"":`<section class="detail-section"><h3>평가</h3><div class="ratings-grid"><div class="rating-box mine"><span class="rating-box-label">내 평가</span><span class="rating-box-value">${stars(r.rating)}<span class="rating-box-sub">${r.rating}/5</span></span></div>${tmdb?`<div class="rating-box"><span class="rating-box-label">TMDb 평가</span><span class="rating-box-value">${Number(r.tmdbRating).toFixed(1)} / 10<span class="rating-box-sub">${count(r.tmdbVoteCount)}명</span></span></div>`:""}</div></section>`}${r.note?`<section class="detail-section"><h3>${w?"메모":"내 감상"}</h3><p>${esc(r.note)}</p></section>`:""}${r.overview?`<section class="detail-section"><h3>${book?"책 소개":"작품 소개"}</h3><p>${esc(r.overview)}</p></section>`:""}${w?`<button class="detail-action" id="completeButton" data-id="${r.id}" type="button">감상 완료로 기록</button>`:`<button class="detail-date-edit" id="recordEditButton" data-id="${r.id}" type="button">기록 수정</button>`}</div>`;open(el.detailOverlay)}

const APP_VERSION="1.8",BACKUP_VERSION=2;
function backupDateText(v){if(!v)return"날짜 정보 없음";const d=new Date(v);if(Number.isNaN(d.getTime()))return"날짜 정보 없음";return new Intl.DateTimeFormat("ko-KR",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).format(d)}
function makeBackup(records){const completedCount=records.filter(r=>r.status==="completed").length,wishlistCount=records.filter(r=>r.status==="wishlist").length;return{app:"Seen",backupVersion:BACKUP_VERSION,appVersion:APP_VERSION,exportedAt:new Date().toISOString(),recordCount:records.length,completedCount,wishlistCount,records}}
function inspectBackup(data){let list=null,legacy=false;if(Array.isArray(data)){list=data;legacy=true}else if(data&&typeof data==="object"&&Array.isArray(data.records)){if(data.app&&data.app!=="Seen")throw new Error("NOT_SEEN");list=data.records;legacy=!data.backupVersion}else throw new Error("INVALID");const records=list.map(r=>normalize(r));if(records.some(r=>!r.title||!["completed","wishlist"].includes(r.status)))throw new Error("INVALID_RECORD");const completedCount=records.filter(r=>r.status==="completed").length,wishlistCount=records.filter(r=>r.status==="wishlist").length;return{records,exportedAt:data&&data.exportedAt?data.exportedAt:null,recordCount:records.length,completedCount,wishlistCount,legacy}}
function openRestorePreview(info,fileName){state.pendingRestore=info;el.restoreFileName.textContent=fileName||"Seen 백업 파일";el.restoreDate.textContent=backupDateText(info.exportedAt);el.restoreTotal.textContent=`${info.recordCount}개`;el.restoreCompleted.textContent=`${info.completedCount}개`;el.restoreWishlist.textContent=`${info.wishlistCount}개`;const current=state.records.length;el.restoreWarning.textContent=`현재 iPhone의 ${current}개 기록이 이 백업의 ${info.recordCount}개 기록으로 교체됩니다.${info.legacy?" 이전 버전의 Seen 백업 파일이지만 복원할 수 있습니다.":""}`;el.confirmRestoreButton.textContent=`${info.recordCount}개 기록 복원하기`;open(el.restoreOverlay)}
function cancelRestore(){state.pendingRestore=null;close(el.restoreOverlay)}
async function refreshStatus(){try{const n=(await getAll()).length;el.storageStatus.textContent=`이 iPhone의 IndexedDB에 ${n}개 기록이 저장되어 있습니다.`}catch{el.storageStatus.textContent="이 iPhone의 저장소 상태를 확인할 수 없습니다."}}
function setLibrarySearch(opened){state.librarySearchOpen=opened;el.librarySearch.classList.toggle("show",opened);el.librarySearchButton.textContent=opened?"×":"⌕";el.librarySearchButton.setAttribute("aria-label",opened?"검색 닫기":"내 기록 검색");if(opened){setTimeout(()=>el.librarySearchInput.focus(),80)}else{state.libraryQuery="";el.librarySearchInput.value="";renderRecords()}}function clearLibrarySearch(){state.libraryQuery="";el.librarySearchInput.value="";renderRecords();el.librarySearchInput.focus()}
el.openAddButton.onclick=()=>openRecord();el.recommendButton.onclick=drawRecommendation;el.closeRecommendButton.onclick=()=>close(el.recommendOverlay);el.recommendContent.addEventListener("click",e=>{if(e.target.closest("#addRecommendationButton"))addRecommendationToQueue()});el.librarySearchButton.onclick=()=>setLibrarySearch(!state.librarySearchOpen);el.statsButton.onclick=openStats;el.closeStatsButton.onclick=closeStats;el.statsPeriod.onchange=renderStats;el.statsType.onchange=renderStats;el.librarySearchInput.oninput=()=>{state.libraryQuery=el.librarySearchInput.value;renderRecords()};el.librarySearchClear.onclick=clearLibrarySearch;el.sortSummaryButton.onclick=()=>{renderSortOptions();open(el.sortOverlay)};el.closeSortButton.onclick=()=>close(el.sortOverlay);el.sortOptions.addEventListener("click",e=>{const b=e.target.closest("[data-sort]");if(!b)return;if(state.tab==="completed")state.sortCompleted=b.dataset.sort;else state.sortWishlist=b.dataset.sort;renderSortOptions();renderRecords();close(el.sortOverlay);toast(`${sortLabel()}으로 정렬했습니다.`)});el.closeRecordButton.onclick=()=>close(el.recordOverlay);el.closeDetailButton.onclick=()=>close(el.detailOverlay);el.settingsButton.onclick=()=>{refreshStatus();open(el.settingsOverlay)};el.closeSettingsButton.onclick=()=>close(el.settingsOverlay);el.closeRecordEditButton.onclick=()=>close(el.recordEditOverlay);el.saveButton.onclick=saveRecord;el.saveRecordEditButton.onclick=saveRecordEdit;[el.recommendOverlay,el.recordOverlay,el.detailOverlay,el.settingsOverlay,el.recordEditOverlay].forEach(o=>o.addEventListener("click",e=>{if(e.target===o)close(o)}));document.querySelector(".main-tabs").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(!b)return;state.tab=b.dataset.tab;state.filter="all";renderTabs();renderFilters();renderRecords()});el.filters.addEventListener("click",e=>{const b=e.target.closest("[data-filter]");if(!b)return;state.filter=b.dataset.filter;renderFilters();renderRecords()});el.typeChoices.addEventListener("click",e=>{const b=e.target.closest("[data-type]");if(!b)return;state.type=b.dataset.type;state.selectedMedia=null;clearResults();renderForm();if(el.titleInput.value.trim())startSearch()});el.ratingChoices.addEventListener("click",e=>{const b=e.target.closest("[data-rating]");if(!b)return;state.rating=Number(b.dataset.rating);renderStars()});el.recordEditRatingChoices.addEventListener("click",e=>{const b=e.target.closest("[data-edit-rating]");if(!b)return;state.editRating=Number(b.dataset.editRating);renderEditStars()});el.recordEditTypeChoices.addEventListener("click",e=>{const b=e.target.closest("[data-edit-type]");if(!b)return;state.editType=b.dataset.editType;state.editSelectedMedia=null;clearEditSearch();renderEditForm()});el.recordEditSearchButton.onclick=searchEditMetadata;el.recordEditTitleInput.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();searchEditMetadata()}});el.recordEditSearchResults.addEventListener("click",e=>{const b=e.target.closest("[data-edit-result]");if(!b)return;const m=el.recordEditSearchResults._items?.[Number(b.dataset.editResult)];if(m)chooseEditMedia(m)});el.unseenInput.onchange=updateMode;el.titleInput.oninput=startSearch;el.searchResults.addEventListener("click",e=>{const b=e.target.closest("[data-result]");if(b){const m=el.searchResults._items[Number(b.dataset.result)];if(m)chooseMedia(m);return}if(e.target.closest("#directEntryButton"))clearResults()});el.unlinkButton.onclick=()=>{state.selectedMedia=null;renderLinked();toast("연결을 해제했습니다.")};el.watchedAtInput.onchange=()=>{if(el.watchedAtInput.value)state.selectedDate=el.watchedAtInput.value};
el.recordList.addEventListener("click",async e=>{const d=e.target.closest("[data-delete]");if(d){const r=state.records.find(x=>x.id===d.dataset.delete);if(!r||!confirm(`“${r.title}” 기록을 삭제하시겠습니까?`))return;try{await remove(r.id);state.records=await getAll();renderRecords();toast("기록을 삭제했습니다.")}catch{toast("삭제에 실패했습니다.")}return}const c=e.target.closest("[data-id]");if(c){const r=state.records.find(x=>x.id===c.dataset.id);if(r)detail(r)}});el.detailContent.addEventListener("click",e=>{const completeButton=e.target.closest("#completeButton");if(completeButton){const r=state.records.find(x=>x.id===completeButton.dataset.id);if(r){close(el.detailOverlay);openRecord({fromWishlist:r})}return}const recordEditButton=e.target.closest("#recordEditButton");if(recordEditButton){const r=state.records.find(x=>x.id===recordEditButton.dataset.id);if(r)openRecordEdit(r)}});el.exportButton.onclick=async()=>{try{const records=await getAll(),backup=makeBackup(records),blob=new Blob([JSON.stringify(backup,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=`Seen-backup-${today()}.json`;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);toast(`${records.length}개 기록의 백업 파일을 만들었습니다.`)}catch{toast("백업 생성에 실패했습니다.")}};el.importButton.onclick=()=>el.importInput.click();el.importInput.onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text()),info=inspectBackup(data);openRestorePreview(info,f.name)}catch(err){console.error(err);state.pendingRestore=null;toast("정상적인 Seen 백업 파일이 아닙니다.")}finally{e.target.value=""}};el.closeRestoreButton.onclick=cancelRestore;el.cancelRestoreButton.onclick=cancelRestore;el.confirmRestoreButton.onclick=async()=>{const info=state.pendingRestore;if(!info)return;el.confirmRestoreButton.disabled=true;try{await replaceAll(info.records);state.records=await getAll();renderRecords();cancelRestore();close(el.settingsOverlay);toast(`${state.records.length}개 기록을 복원했습니다.`)}catch(e){console.error(e);toast("복원에 실패했습니다.")}finally{el.confirmRestoreButton.disabled=false}};el.clearButton.onclick=async()=>{if(!state.records.length)return toast("삭제할 기록이 없습니다.");if(!confirm("정말 모든 Seen 기록을 삭제하시겠습니까?"))return;try{await clearDb();state.records=[];renderRecords();close(el.settingsOverlay);toast("모든 기록을 삭제했습니다.")}catch{toast("삭제에 실패했습니다.")}};
(async function init(){try{state.db=await openDb();state.records=await getAll();state.selectedDate=today();renderTabs();renderFilters();renderRecords();renderForm()}catch(e){console.error(e);toast("Seen 저장소를 시작하지 못했습니다. Safari 설정을 확인해 주세요.")}})();
</script>
