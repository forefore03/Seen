    .app-shell{max-width:680px;min-height:100dvh;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 20px calc(100px + env(safe-area-inset-bottom))}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{margin:0;font-size:34px;font-weight:800;letter-spacing:-1.8px}.icon-button{width:44px;height:44px;border:0;border-radius:14px;background:var(--surface);color:var(--text);cursor:pointer;font-size:22px;box-shadow:0 2px 8px rgba(25,29,24,.05)}.hero{margin:28px 0 18px}.eyebrow{margin:0 0 6px;color:var(--accent);font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.hero h2{margin:0;font-size:24px;letter-spacing:-1px}

    .add-button{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));left:20px;z-index:5;max-width:640px;min-height:56px;margin:0 auto;border:0;border-radius:18px;background:var(--accent);color:#fff;cursor:pointer;box-shadow:0 10px 28px rgba(45,77,58,.28);font-size:16px;font-weight:800}.add-button:active{transform:scale(.99)}
    .overlay{position:fixed;z-index:20;inset:0;display:flex;align-items:flex-end;background:rgba(18,20,18,.38);opacity:0;pointer-events:none;transition:opacity .22s ease}.overlay.show{opacity:1;pointer-events:auto}.sheet{width:min(680px,100%);max-height:min(90dvh,800px);margin:0 auto;padding:12px 20px calc(24px + env(safe-area-inset-bottom));overflow-y:auto;border-radius:26px 26px 0 0;background:var(--surface);transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}.overlay.show .sheet{transform:translateY(0)}.handle{width:38px;height:4px;margin:0 auto 15px;border-radius:999px;background:#d3d3cd}.sheet-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.sheet-title{margin:0;font-size:22px;letter-spacing:-1px}.close-button{width:36px;height:36px;border:0;border-radius:50%;background:var(--soft);cursor:pointer;font-size:20px}.field{margin-bottom:22px}.field label{display:block;margin-bottom:9px;font-size:14px;font-weight:800}.field-hint{margin:-3px 0 9px;color:var(--muted);font-size:12px;line-height:1.4}.text-input,.date-input,.text-area{width:100%;border:1px solid #d9d9d1;border-radius:14px;outline:none;background:#fff;color:var(--text);font-size:16px}.text-input,.date-input{min-height:50px;padding:0 14px}.text-area{min-height:92px;padding:13px 14px;resize:vertical;line-height:1.55}.text-input:focus,.date-input:focus,.text-area:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(45,77,58,.12)}.type-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.type-choice{min-height:48px;padding:5px 3px;border:1px solid #dcdcd5;border-radius:12px;background:#fff;color:var(--muted);cursor:pointer;font-size:12px;font-weight:700}.type-choice.selected{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}.rating-row{display:flex;gap:4px}.star-button{width:48px;height:48px;padding:0;border:0;background:transparent;color:#d7d7cf;cursor:pointer;font-size:32px;line-height:1}.star-button.selected{color:var(--star)}
    .optional-toggle{display:flex;width:100%;align-items:center;justify-content:space-between;min-height:52px;padding:0 4px;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff;color:var(--accent);cursor:pointer;font-size:15px;font-weight:800}.optional-toggle span:last-child{font-size:20px;font-weight:400}.optional-fields{display:none;padding:20px 0 2px}.optional-fields.show{display:block}.tag-row{display:flex;flex-wrap:wrap;gap:8px}.tag-chip{min-height:36px;padding:0 13px;border:1px solid #dcdcd5;border-radius:99px;background:#fff;color:var(--muted);cursor:pointer;font-size:13px;font-weight:700}.tag-chip.selected{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}.custom-tag-row{display:flex;gap:8px;margin-top:10px}.custom-tag-row .text-input{min-height:42px}.small-button{flex:0 0 auto;min-width:58px;border:0;border-radius:12px;background:var(--soft);color:var(--accent);cursor:pointer;font-size:13px;font-weight:800}.switch-row{display:flex;align-items:center;justify-content:space-between;min-height:52px;padding:0 2px}.switch-row label{margin:0}.switch{position:relative;width:48px;height:30px}.switch input{width:0;height:0;opacity:0}.slider{position:absolute;inset:0;border-radius:999px;background:#d4d4ce;cursor:pointer;transition:.2s}.slider:before{position:absolute;bottom:4px;left:4px;width:22px;height:22px;border-radius:50%;background:#fff;content:"";transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.15)}.switch input:checked+.slider{background:var(--accent)}.switch input:checked+.slider:before{transform:translateX(18px)}.save-button{width:100%;min-height:56px;margin-top:22px;border:0;border-radius:16px;background:var(--accent);color:#fff;cursor:pointer;font-size:16px;font-weight:800}.save-button:disabled{background:#bfc6bf;cursor:not-allowed}
    .detail-content{padding-bottom:8px}.detail-icon{display:grid;width:62px;height:62px;place-items:center;margin-bottom:16px;border-radius:18px;background:var(--accent-soft);font-size:28px}.detail-title{margin:0;font-size:24px;letter-spacing:-1px}.detail-meta{margin:7px 0 8px;color:var(--muted);font-size:14px}.detail-rating{margin:0 0 22px;color:var(--star);font-size:20px;letter-spacing:1px}.detail-section{margin-top:20px;padding-top:20px;border-top:1px solid var(--line)}.detail-section h3{margin:0 0 9px;font-size:14px}.detail-section p{margin:0;color:#454540;font-size:15px;line-height:1.65;white-space:pre-wrap}.detail-tags{display:flex;flex-wrap:wrap;gap:7px}.detail-tag{padding:7px 10px;border-radius:99px;background:var(--soft);color:var(--accent);font-size:13px;font-weight:700}.settings-copy{margin:-8px 0 22px;color:var(--muted);font-size:14px;line-height:1.55}.settings-button{display:flex;width:100%;min-height:54px;align-items:center;justify-content:space-between;margin-bottom:10px;padding:0 16px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--text);cursor:pointer;text-align:left;font-size:15px;font-weight:750}.settings-button.danger{color:var(--danger)}#importInput{display:none}.toast{position:fixed;z-index:50;bottom:calc(92px + env(safe-area-inset-bottom));left:50%;padding:12px 16px;border-radius:12px;background:#272a27;color:#fff;opacity:0;pointer-events:none;transform:translate(-50%,12px);transition:opacity .2s ease,transform .2s ease;font-size:14px;font-weight:700;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(min-width:700px){.add-button{right:auto;left:50%;width:640px;transform:translateX(-50%)}.add-button:active{transform:translateX(-50%) scale(.99)}}
  </style>

<body>
  <main class="app-shell"><header class="topbar"><h1 class="brand">Seen</h1><button class="icon-button" id="settingsButton" type="button" aria-label="설정">⚙︎</button></header><section class="hero"><p class="eyebrow">Personal content history</p><h2>내가 본 것들</h2></section><nav class="filters" id="filters" aria-label="콘텐츠 유형 필터"></nav><section id="recordList" aria-live="polite"></section></main>
  <button class="add-button" id="openAddButton" type="button">＋ 새 기록 추가</button>
  <div class="overlay" id="recordOverlay" aria-hidden="true"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="recordSheetTitle"><div class="handle"></div><header class="sheet-header"><h2 class="sheet-title" id="recordSheetTitle">새 기록</h2><button class="close-button" id="closeRecordButton" type="button" aria-label="닫기">×</button></header><form id="recordForm">
    <div class="field"><label for="titleInput">무엇을 보셨나요?</label><input class="text-input" id="titleInput" type="text" maxlength="120" autocomplete="off" placeholder="제목을 입력하세요" required /></div>
    <div class="field"><label>유형</label><div class="type-grid" id="typeChoices"></div></div>
    <div class="field"><label>내 평점</label><div class="rating-row" id="ratingChoices" aria-label="별점 선택"></div></div>
    <div class="field"><label for="watchedAtInput">감상일</label><input class="date-input" id="watchedAtInput" type="date" required /></div>
    <button class="optional-toggle" id="optionalToggle" type="button"><span>선택 기록 더하기</span><span id="optionalChevron">＋</span></button>
    <div class="optional-fields" id="optionalFields">
      <div class="field"><label for="noteInput">한 줄 감상</label><p class="field-hint">나중의 나에게 남기는 짧은 메모입니다.</p><textarea class="text-area" id="noteInput" maxlength="300" placeholder="예: 생각보다 여운이 오래 남았다."></textarea></div>
      <div class="field"><label>이때의 맥락</label><p class="field-hint">해당하는 태그만 가볍게 고르세요. 선택하지 않아도 됩니다.</p><div class="tag-row" id="tagChoices"></div><div class="custom-tag-row"><input class="text-input" id="customTagInput" type="text" maxlength="20" placeholder="직접 태그 입력" /><button class="small-button" id="addCustomTagButton" type="button">추가</button></div></div>
      <div class="field"><div class="switch-row"><label for="rewatchInput">다시 본 작품입니다</label><label class="switch"><input id="rewatchInput" type="checkbox" /><span class="slider"></span></label></div></div>
    </div>
    <button class="save-button" id="saveButton" type="submit" disabled>기록 저장</button>
  </form></section></div>
  <div class="overlay" id="detailOverlay" aria-hidden="true"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="detailSheetTitle"><div class="handle"></div><header class="sheet-header"><h2 class="sheet-title" id="detailSheetTitle">내 기록</h2><button class="close-button" id="closeDetailButton" type="button" aria-label="닫기">×</button></header><div class="detail-content" id="detailContent"></div></section></div>
  <div class="overlay" id="settingsOverlay" aria-hidden="true"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="settingsSheetTitle"><div class="handle"></div><header class="sheet-header"><h2 class="sheet-title" id="settingsSheetTitle">설정</h2><button class="close-button" id="closeSettingsButton" type="button" aria-label="닫기">×</button></header><div><p class="settings-copy">Seen의 기록은 현재 이 iPhone 브라우저에 저장됩니다. 중요한 기록은 정기적으로 백업해 주세요.</p><button class="settings-button" id="exportButton" type="button"><span>기록 내보내기</span><span>↓</span></button><button class="settings-button" id="importButton" type="button"><span>백업 파일에서 복원</span><span>↑</span></button><input id="importInput" type="file" accept="application/json,.json" /><button class="settings-button danger" id="clearButton" type="button"><span>모든 기록 삭제</span><span>×</span></button></div></section></div>
  <div class="toast" id="toast" role="status"></div>
<script>
const STORAGE_KEY="seen.records.v2"; const LEGACY_KEY="seen.records.v1";
const TYPES=[{id:"all",label:"전체",icon:"◌"},{id:"movie",label:"영화",icon:"🎬"},{id:"series",label:"시리즈",icon:"📺"},{id:"book",label:"책",icon:"📚"},{id:"animation",label:"애니",icon:"✨"},{id:"documentary",label:"다큐",icon:"🌍"}];
const CONTEXT_TAGS=["혼자", "가족과", "친구와", "연인과", "주말", "출장", "캠핑", "비 오는 날", "다시 봄"];
const state={filter:"all",type:"movie",rating:0,tags:[],records:loadRecords()};
const $=id=>document.getElementById(id); const el={filters:$("filters"),recordList:$("recordList"),recordOverlay:$("recordOverlay"),detailOverlay:$("detailOverlay"),settingsOverlay:$("settingsOverlay"),openAddButton:$("openAddButton"),closeRecordButton:$("closeRecordButton"),closeDetailButton:$("closeDetailButton"),settingsButton:$("settingsButton"),closeSettingsButton:$("closeSettingsButton"),recordForm:$("recordForm"),titleInput:$("titleInput"),watchedAtInput:$("watchedAtInput"),noteInput:$("noteInput"),rewatchInput:$("rewatchInput"),typeChoices:$("typeChoices"),ratingChoices:$("ratingChoices"),tagChoices:$("tagChoices"),customTagInput:$("customTagInput"),addCustomTagButton:$("addCustomTagButton"),optionalToggle:$("optionalToggle"),optionalFields:$("optionalFields"),optionalChevron:$("optionalChevron"),saveButton:$("saveButton"),detailContent:$("detailContent"),exportButton:$("exportButton"),importButton:$("importButton"),importInput:$("importInput"),clearButton:$("clearButton"),toast:$("toast")};
function loadRecords(){try{const v2=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null");if(Array.isArray(v2))return v2;const v1=JSON.parse(localStorage.getItem(LEGACY_KEY)||"[]");return Array.isArray(v1)?v1.map(r=>({...r,note:"",tags:[],isRewatch:false})):[]}catch{return[]}} function saveRecords(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state.records))} function typeInfo(id){return TYPES.find(t=>t.id===id)||TYPES[0]} function todayString(){const n=new Date(),o=n.getTimezoneOffset();return new Date(n.getTime()-o*60000).toISOString().slice(0,10)} function formatDate(v){const[y,m,d]=v.split("-").map(Number),t=new Date(),today=new Date(t.getFullYear(),t.getMonth(),t.getDate()),target=new Date(y,m-1,d),diff=Math.round((today-target)/86400000);if(diff===0)return"오늘";if(diff===1)return"어제";return`${y}. ${String(m).padStart(2,"0")}. ${String(d).padStart(2,"0")}`} function stars(r){return"★".repeat(r)+"☆".repeat(5-r)} function esc(v){return String(v||"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"})[c])}
function renderFilters(){el.filters.innerHTML=TYPES.map(t=>`<button class="filter-button ${state.filter===t.id?"active":""}" type="button" data-filter="${t.id}">${t.label}</button>`).join("")} function renderRecords(){const list=state.records.filter(r=>state.filter==="all"||r.type===state.filter).sort((a,b)=>b.watchedAt.localeCompare(a.watchedAt)||b.createdAt.localeCompare(a.createdAt));if(!list.length){const msg=state.filter==="all"?"첫 기록을 남겨 보세요.":`${typeInfo(state.filter).label} 기록이 아직 없습니다.`;el.recordList.innerHTML=`<div class="empty-state"><span class="empty-icon">✦</span><h3>아직 기록이 없습니다</h3><p>${msg}<br>별점 하나로 충분합니다.</p></div>`;return}el.recordList.innerHTML=list.map(r=>{const t=typeInfo(r.type);return`<article class="record-card ${r.note||r.tags?.length||r.isRewatch?"has-note":""}" data-record-id="${r.id}"><div class="type-badge">${t.icon}</div><div class="record-main"><h3 class="record-title">${esc(r.title)}</h3><p class="record-meta">${t.label} · ${formatDate(r.watchedAt)}${r.isRewatch?" · 재감상":""}</p><p class="record-rating">${stars(r.rating)}</p></div><button class="delete-button" type="button" data-delete-id="${r.id}" aria-label="${esc(r.title)} 기록 삭제">⌫</button></article>`}).join("")}
function renderForm(){el.typeChoices.innerHTML=TYPES.filter(t=>t.id!=="all").map(t=>`<button class="type-choice ${state.type===t.id?"selected":""}" type="button" data-type="${t.id}">${t.label}</button>`).join("");el.ratingChoices.innerHTML=[1,2,3,4,5].map(n=>`<button class="star-button ${n<=state.rating?"selected":""}" type="button" data-rating="${n}" aria-label="${n}점">★</button>`).join("");el.tagChoices.innerHTML=[...CONTEXT_TAGS,...state.tags.filter(t=>!CONTEXT_TAGS.includes(t))].map(t=>`<button class="tag-chip ${state.tags.includes(t)?"selected":""}" type="button" data-tag="${esc(t)}">${esc(t)}</button>`).join("");validate()} function validate(){el.saveButton.disabled=!(el.titleInput.value.trim()&&state.rating>0)} function open(o){o.classList.add("show");o.setAttribute("aria-hidden","false")} function close(o){o.classList.remove("show");o.setAttribute("aria-hidden","true")} function toast(m){el.toast.textContent=m;el.toast.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>el.toast.classList.remove("show"),1900)} function id(){return crypto?.randomUUID?crypto.randomUUID():`seen_${Date.now()}_${Math.random().toString(16).slice(2)}`}
function openRecord(){state.type="movie";state.rating=0;state.tags=[];el.recordForm.reset();el.watchedAtInput.value=todayString();el.optionalFields.classList.remove("show");el.optionalChevron.textContent="＋";renderForm();open(el.recordOverlay);setTimeout(()=>el.titleInput.focus(),260)} function toggleOptional(){const show=el.optionalFields.classList.toggle("show");el.optionalChevron.textContent=show?"−":"＋"} function addTag(value){const tag=value.trim().replace(/\s+/g," ");if(!tag)return;if(!state.tags.includes(tag))state.tags.push(tag);el.customTagInput.value="";renderForm()}
function showDetail(record){const t=typeInfo(record.type);const tags=(record.tags||[]).map(tag=>`<span class="detail-tag">${esc(tag)}</span>`).join("");el.detailContent.innerHTML=`<div class="detail-icon">${t.icon}</div><h2 class="detail-title">${esc(record.title)}</h2><p class="detail-meta">${t.label} · ${formatDate(record.watchedAt)}${record.isRewatch?" · 다시 봄":""}</p><p class="detail-rating">${stars(record.rating)}</p>${record.note?`<section class="detail-section"><h3>한 줄 감상</h3><p>${esc(record.note)}</p></section>`:""}${tags?`<section class="detail-section"><h3>이때의 맥락</h3><div class="detail-tags">${tags}</div></section>`:""}`;open(el.detailOverlay)}
el.openAddButton.addEventListener("click",openRecord);el.closeRecordButton.addEventListener("click",()=>close(el.recordOverlay));el.settingsButton.addEventListener("click",()=>open(el.settingsOverlay));el.closeSettingsButton.addEventListener("click",()=>close(el.settingsOverlay));el.closeDetailButton.addEventListener("click",()=>close(el.detailOverlay));[el.recordOverlay,el.detailOverlay,el.settingsOverlay].forEach(o=>o.addEventListener("click",e=>{if(e.target===o)close(o)}));el.optionalToggle.addEventListener("click",toggleOptional);
el.filters.addEventListener("click",e=>{const b=e.target.closest("[data-filter]");if(!b)return;state.filter=b.dataset.filter;renderFilters();renderRecords()});el.typeChoices.addEventListener("click",e=>{const b=e.target.closest("[data-type]");if(!b)return;state.type=b.dataset.type;renderForm()});el.ratingChoices.addEventListener("click",e=>{const b=e.target.closest("[data-rating]");if(!b)return;state.rating=Number(b.dataset.rating);renderForm()});el.tagChoices.addEventListener("click",e=>{const b=e.target.closest("[data-tag]");if(!b)return;const tag=b.dataset.tag;state.tags=state.tags.includes(tag)?state.tags.filter(t=>t!==tag):[...state.tags,tag];renderForm()});el.addCustomTagButton.addEventListener("click",()=>addTag(el.customTagInput.value));el.customTagInput.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();addTag(el.customTagInput.value)}});el.titleInput.addEventListener("input",validate);
el.recordForm.addEventListener("submit",e=>{e.preventDefault();const title=el.titleInput.value.trim();if(!title||!state.rating)return;state.records.push({id:id(),title,type:state.type,rating:state.rating,watchedAt:el.watchedAtInput.value||todayString(),note:el.noteInput.value.trim(),tags:state.tags,isRewatch:el.rewatchInput.checked,createdAt:new Date().toISOString()});saveRecords();state.filter="all";renderFilters();renderRecords();close(el.recordOverlay);toast("기록했습니다.")});el.recordList.addEventListener("click",e=>{const del=e.target.closest("[data-delete-id]");if(del){const r=state.records.find(x=>x.id===del.dataset.deleteId);if(!r||!confirm(`“${r.title}” 기록을 삭제하시겠습니까?`))return;state.records=state.records.filter(x=>x.id!==r.id);saveRecords();renderRecords();toast("기록을 삭제했습니다.");return}const card=e.target.closest("[data-record-id]");if(card){const r=state.records.find(x=>x.id===card.dataset.recordId);if(r)showDetail(r)}});
el.exportButton.addEventListener("click",()=>{const backup={app:"Seen",version:2,exportedAt:new Date().toISOString(),records:state.records};const blob=new Blob([JSON.stringify(backup,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=`Seen-backup-${todayString()}.json`;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);toast("백업 파일을 만들었습니다.")});el.importButton.addEventListener("click",()=>el.importInput.click());el.importInput.addEventListener("change",async e=>{const f=e.target.files?.[0];if(!f)return;try{const c=JSON.parse(await f.text()),incoming=Array.isArray(c)?c:c.records;if(!Array.isArray(incoming))throw Error();const valid=incoming.filter(r=>r&&r.id&&r.title&&r.type&&Number(r.rating)>0&&r.watchedAt).map(r=>({...r,note:r.note||"",tags:Array.isArray(r.tags)?r.tags:[],isRewatch:Boolean(r.isRewatch)}));if(!confirm(`${valid.length}개의 기록으로 현재 Seen 데이터를 교체하시겠습니까?`))return;state.records=valid;saveRecords();state.filter="all";renderFilters();renderRecords();close(el.settingsOverlay);toast(`${valid.length}개 기록을 복원했습니다.`)}catch{alert("Seen 백업 JSON 파일을 읽지 못했습니다.")}finally{e.target.value=""}});el.clearButton.addEventListener("click",()=>{if(!state.records.length)return toast("삭제할 기록이 없습니다.");if(!confirm("정말 모든 Seen 기록을 삭제하시겠습니까? 이 작업은 되돌릴 수 없습니다."))return;state.records=[];saveRecords();renderRecords();close(el.settingsOverlay);toast("모든 기록을 삭제했습니다.")});document.addEventListener("keydown",e=>{if(e.key==="Escape"){close(el.recordOverlay);close(el.detailOverlay);close(el.settingsOverlay)}});renderFilters();renderRecords();renderForm();
</script>
</body>
</html>
