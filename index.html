  <title>Seen</title>
  <style>
    :root{--bg:#f7f7f4;--surface:#fff;--soft:#f0f0eb;--text:#1c1c1a;--muted:#77776f;--line:#e7e7df;--accent:#2d4d3a;--accent-soft:#e4eee6;--star:#f1ae2b;--danger:#b3261e}
    *{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-width:320px;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;-webkit-font-smoothing:antialiased}button,input,textarea{font:inherit}button{-webkit-tap-highlight-color:transparent}
    .app-shell{max-width:680px;min-height:100dvh;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 20px calc(100px + env(safe-area-inset-bottom))}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{margin:0;font-size:34px;font-weight:800;letter-spacing:-1.8px}.icon-button{width:44px;height:44px;border:0;border-radius:14px;background:var(--surface);color:var(--text);cursor:pointer;font-size:22px;box-shadow:0 2px 8px rgba(25,29,24,.05)}.hero{margin:28px 0 18px}.eyebrow{margin:0 0 6px;color:var(--accent);font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.hero h2{margin:0;font-size:24px;letter-spacing:-1px}
    .main-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:13px;padding:4px;border-radius:15px;background:var(--soft)}.main-tab{min-height:42px;border:0;border-radius:11px;background:transparent;color:var(--muted);cursor:pointer;font-size:14px;font-weight:800}.main-tab.active{background:var(--surface);color:var(--accent);box-shadow:0 2px 6px rgba(25,29,24,.08)}.filters{display:flex;gap:8px;overflow-x:auto;padding:4px 0 18px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.filter-button{flex:0 0 auto;min-height:36px;padding:0 14px;border:1px solid transparent;border-radius:99px;background:var(--soft);color:var(--muted);cursor:pointer;font-size:14px;font-weight:700}.filter-button.active{background:var(--accent);color:#fff}
    #recordList{display:grid;gap:10px}.record-card{display:grid;grid-template-columns:48px 1fr auto;gap:13px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:18px;background:var(--surface);box-shadow:0 2px 8px rgba(25,29,24,.03);cursor:pointer}.type-badge{display:grid;width:48px;height:48px;place-items:center;border-radius:14px;background:var(--accent-soft);font-size:22px}.record-main{min-width:0}.record-title{overflow:hidden;margin:0;font-size:16px;font-weight:800;line-height:1.3;text-overflow:ellipsis;white-space:nowrap}.record-meta{margin:4px 0 0;color:var(--muted);font-size:13px}.record-rating{margin:5px 0 0;color:var(--star);font-size:15px;letter-spacing:1px}.wishlist-note{overflow:hidden;margin:5px 0 0;color:#565650;font-size:13px;line-height:1.3;text-overflow:ellipsis;white-space:nowrap}.delete-button{width:36px;height:36px;border:0;border-radius:10px;background:transparent;color:#a2a29c;cursor:pointer;font-size:17px}.delete-button:active{background:#f5e7e5;color:var(--danger)}.empty-state{padding:42px 24px;border:1px dashed #cfcec5;border-radius:20px;color:var(--muted);text-align:center}.empty-state .empty-icon{display:block;margin-bottom:12px;font-size:34px}.empty-state h3{margin:0 0 7px;color:var(--text);font-size:17px}.empty-state p{margin:0;font-size:14px;line-height:1.6}
    .add-button{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));left:20px;z-index:5;max-width:640px;min-height:56px;margin:0 auto;border:0;border-radius:18px;background:var(--accent);color:#fff;cursor:pointer;box-shadow:0 10px 28px rgba(45,77,58,.28);font-size:16px;font-weight:800}.add-button:active{transform:scale(.99)}
    .overlay{position:fixed;z-index:20;inset:0;display:flex;align-items:flex-end;background:rgba(18,20,18,.38);opacity:0;pointer-events:none;transition:opacity .22s ease}.overlay.show{opacity:1;pointer-events:auto}.sheet{width:min(680px,100%);max-height:min(90dvh,800px);margin:0 auto;padding:12px 20px calc(24px + env(safe-area-inset-bottom));overflow-y:auto;border-radius:26px 26px 0 0;background:var(--surface);transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}.overlay.show .sheet{transform:translateY(0)}.handle{width:38px;height:4px;margin:0 auto 15px;border-radius:999px;background:#d3d3cd}.sheet-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.sheet-title{margin:0;font-size:22px;letter-spacing:-1px}.close-button{width:36px;height:36px;border:0;border-radius:50%;background:var(--soft);cursor:pointer;font-size:20px}.field{margin-bottom:22px}.field label{display:block;margin-bottom:9px;font-size:14px;font-weight:800}.field-hint{margin:-3px 0 9px;color:var(--muted);font-size:12px;line-height:1.45}.text-input,.date-input,.text-area{width:100%;border:1px solid #d9d9d1;border-radius:14px;outline:none;background:#fff;color:var(--text);font-size:16px}.text-input,.date-input{min-height:50px;padding:0 14px}.text-area{min-height:88px;padding:13px 14px;resize:vertical;line-height:1.55}.text-input:focus,.date-input:focus,.text-area:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(45,77,58,.12)}.type-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.type-choice{min-height:48px;padding:5px 3px;border:1px solid #dcdcd5;border-radius:12px;background:#fff;color:var(--muted);cursor:pointer;font-size:12px;font-weight:700}.type-choice.selected{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}.rating-row{display:flex;gap:4px}.star-button{width:48px;height:48px;padding:0;border:0;background:transparent;color:#d7d7cf;cursor:pointer;font-size:32px;line-height:1}.star-button.selected{color:var(--star)}.completion-only.hidden{display:none}
    .switch-row{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:-3px 0 22px;padding:14px 2px;border-bottom:1px solid var(--line)}.switch-copy strong{display:block;font-size:15px}.switch-copy span{display:block;margin-top:3px;color:var(--muted);font-size:12px;line-height:1.35}.switch{position:relative;flex:0 0 auto;width:48px;height:30px}.switch input{width:0;height:0;opacity:0}.slider{position:absolute;inset:0;border-radius:999px;background:#d4d4ce;cursor:pointer;transition:.2s}.slider:before{position:absolute;bottom:4px;left:4px;width:22px;height:22px;border-radius:50%;background:#fff;content:"";transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.15)}.switch input:checked+.slider{background:var(--accent)}.switch input:checked+.slider:before{transform:translateX(18px)}.save-button{width:100%;min-height:56px;margin-top:4px;border:0;border-radius:16px;background:var(--accent);color:#fff;cursor:pointer;font-size:16px;font-weight:800}.save-button:disabled{background:#bfc6bf;cursor:not-allowed}
    .detail-content{padding-bottom:8px}.detail-icon{display:grid;width:62px;height:62px;place-items:center;margin-bottom:16px;border-radius:18px;background:var(--accent-soft);font-size:28px}.detail-title{margin:0;font-size:24px;letter-spacing:-1px}.detail-meta{margin:7px 0 8px;color:var(--muted);font-size:14px}.detail-rating{margin:0 0 22px;color:var(--star);font-size:20px;letter-spacing:1px}.detail-section{margin-top:20px;padding-top:20px;border-top:1px solid var(--line)}.detail-section h3{margin:0 0 9px;font-size:14px}.detail-section p{margin:0;color:#454540;font-size:15px;line-height:1.65;white-space:pre-wrap}.detail-action{width:100%;min-height:54px;margin-top:26px;border:0;border-radius:15px;background:var(--accent);color:#fff;cursor:pointer;font-size:16px;font-weight:800}.settings-copy{margin:-8px 0 22px;color:var(--muted);font-size:14px;line-height:1.55}.settings-button{display:flex;width:100%;min-height:54px;align-items:center;justify-content:space-between;margin-bottom:10px;padding:0 16px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--text);cursor:pointer;text-align:left;font-size:15px;font-weight:750}.settings-button.danger{color:var(--danger)}#importInput{display:none}.toast{position:fixed;z-index:50;bottom:calc(92px + env(safe-area-inset-bottom));left:50%;padding:12px 16px;border-radius:12px;background:#272a27;color:#fff;opacity:0;pointer-events:none;transform:translate(-50%,12px);transition:opacity .2s ease,transform .2s ease;font-size:14px;font-weight:700;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(min-width:700px){.add-button{right:auto;left:50%;width:640px;transform:translateX(-50%)}.add-button:active{transform:translateX(-50%) scale(.99)}}
  </style>

<body>
  <main class="app-shell">
    <header class="topbar"><h1 class="brand">Seen</h1><button class="icon-button" id="settingsButton" type="button" aria-label="설정">⚙︎</button></header>
    <section class="hero"><p class="eyebrow">Personal content history</p><h2>내 콘텐츠</h2></section>
    <nav class="main-tabs" aria-label="기록 구분"><button class="main-tab active" type="button" data-tab="completed">본 것</button><button class="main-tab" type="button" data-tab="wishlist">보고 싶은 것</button></nav>
    <nav class="filters" id="filters" aria-label="콘텐츠 유형 필터"></nav><section id="recordList" aria-live="polite"></section>
  </main>
  <button class="add-button" id="openAddButton" type="button">＋ 새 기록 추가</button>

  <div class="overlay" id="recordOverlay" aria-hidden="true"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="recordSheetTitle"><div class="handle"></div><header class="sheet-header"><h2 class="sheet-title" id="recordSheetTitle">새 기록</h2><button class="close-button" id="closeRecordButton" type="button" aria-label="닫기">×</button></header><form id="recordForm">
    <div class="field"><label for="titleInput" id="titleLabel">무엇을 보셨나요?</label><input class="text-input" id="titleInput" type="text" maxlength="120" autocomplete="off" placeholder="제목을 입력하세요" required /></div>
    <div class="switch-row"><div class="switch-copy"><strong>아직 보지 않은 콘텐츠입니다</strong><span id="unseenHelp">켜면 보고 싶은 목록에 저장됩니다.</span></div><label class="switch"><input id="unseenInput" type="checkbox" /><span class="slider"></span></label></div>
    <div class="field"><label>유형</label><div class="type-grid" id="typeChoices"></div></div>
    <div class="field completion-only" id="ratingField"><label>내 평점</label><div class="rating-row" id="ratingChoices" aria-label="별점 선택"></div></div>
    <div class="field completion-only" id="dateField"><label for="watchedAtInput">감상일</label><input class="date-input" id="watchedAtInput" type="date" required /></div>
    <div class="field"><label for="noteInput" id="noteLabel">한 줄 감상 <span style="color:#77776f;font-weight:600">· 선택</span></label><p class="field-hint" id="noteHint">나중의 나에게 남기는 짧은 메모입니다.</p><textarea class="text-area" id="noteInput" maxlength="300" placeholder="예: 특이한 첩보물. 호텔 관리인이라니."></textarea></div>
    <button class="save-button" id="saveButton" type="submit" disabled>기록 저장</button>
  </form></section></div>

  <div class="overlay" id="detailOverlay" aria-hidden="true"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="detailSheetTitle"><div class="handle"></div><header class="sheet-header"><h2 class="sheet-title" id="detailSheetTitle">내 기록</h2><button class="close-button" id="closeDetailButton" type="button" aria-label="닫기">×</button></header><div class="detail-content" id="detailContent"></div></section></div>
  <div class="overlay" id="settingsOverlay" aria-hidden="true"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="settingsSheetTitle"><div class="handle"></div><header class="sheet-header"><h2 class="sheet-title" id="settingsSheetTitle">설정</h2><button class="close-button" id="closeSettingsButton" type="button" aria-label="닫기">×</button></header><div><p class="settings-copy">Seen의 기록은 현재 이 iPhone 브라우저에 저장됩니다. 중요한 기록은 정기적으로 백업해 주세요.</p><button class="settings-button" id="exportButton" type="button"><span>기록 내보내기</span><span>↓</span></button><button class="settings-button" id="importButton" type="button"><span>백업 파일에서 복원</span><span>↑</span></button><input id="importInput" type="file" accept="application/json,.json" /><button class="settings-button danger" id="clearButton" type="button"><span>모든 기록 삭제</span><span>×</span></button></div></section></div>
  <div class="toast" id="toast" role="status"></div>
<script>
const STORAGE_KEY="seen.records.v4",LEGACY_KEYS=["seen.records.v3","seen.records.v2","seen.records.v1"];
const TYPES=[{id:"all",label:"전체",icon:"◌"},{id:"movie",label:"영화",icon:"🎬"},{id:"series",label:"시리즈",icon:"📺"},{id:"book",label:"책",icon:"📚"},{id:"animation",label:"애니",icon:"✨"},{id:"documentary",label:"다큐",icon:"🌍"}];
const state={tab:"completed",filter:"all",type:"movie",rating:0,editingWishlistId:null,records:loadRecords()};
const $=id=>document.getElementById(id);const el={filters:$("filters"),recordList:$("recordList"),recordOverlay:$("recordOverlay"),detailOverlay:$("detailOverlay"),settingsOverlay:$("settingsOverlay"),openAddButton:$("openAddButton"),closeRecordButton:$("closeRecordButton"),closeDetailButton:$("closeDetailButton"),settingsButton:$("settingsButton"),closeSettingsButton:$("closeSettingsButton"),recordForm:$("recordForm"),unseenInput:$("unseenInput"),unseenHelp:$("unseenHelp"),titleLabel:$("titleLabel"),titleInput:$("titleInput"),watchedAtInput:$("watchedAtInput"),noteInput:$("noteInput"),noteLabel:$("noteLabel"),noteHint:$("noteHint"),typeChoices:$("typeChoices"),ratingChoices:$("ratingChoices"),ratingField:$("ratingField"),dateField:$("dateField"),saveButton:$("saveButton"),detailContent:$("detailContent"),exportButton:$("exportButton"),importButton:$("importButton"),importInput:$("importInput"),clearButton:$("clearButton"),toast:$("toast")};
function normalize(r){return{...r,status:r.status||"completed",note:r.note||"",createdAt:r.createdAt||new Date().toISOString()}}function loadRecords(){try{let saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null");if(Array.isArray(saved))return saved.map(normalize);for(const key of LEGACY_KEYS){saved=JSON.parse(localStorage.getItem(key)||"null");if(Array.isArray(saved))return saved.map(normalize)}return[]}catch{return[]}}function saveRecords(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state.records))}function typeInfo(id){return TYPES.find(t=>t.id===id)||TYPES[0]}function today(){const n=new Date(),o=n.getTimezoneOffset();return new Date(n.getTime()-o*60000).toISOString().slice(0,10)}function dateText(v){if(!v)return"";const[y,m,d]=v.split("-").map(Number),n=new Date(),a=new Date(n.getFullYear(),n.getMonth(),n.getDate()),b=new Date(y,m-1,d),diff=Math.round((a-b)/86400000);if(diff===0)return"오늘";if(diff===1)return"어제";return`${y}. ${String(m).padStart(2,"0")}. ${String(d).padStart(2,"0")}`}function stars(n){return"★".repeat(n)+"☆".repeat(5-n)}function esc(v){return String(v||"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"})[c])}function uid(){return crypto?.randomUUID?crypto.randomUUID():`seen_${Date.now()}_${Math.random().toString(16).slice(2)}`}
function renderTabs(){document.querySelectorAll(".main-tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===state.tab))}function renderFilters(){el.filters.innerHTML=TYPES.map(t=>`<button class="filter-button ${state.filter===t.id?"active":""}" type="button" data-filter="${t.id}">${t.label}</button>`).join("")}function renderRecords(){const list=state.records.filter(r=>r.status===state.tab&&(state.filter==="all"||r.type===state.filter)).sort((a,b)=>{const ad=a.status==="completed"?a.watchedAt:a.createdAt,bd=b.status==="completed"?b.watchedAt:b.createdAt;return String(bd).localeCompare(String(ad))});if(!list.length){const wish=state.tab==="wishlist";el.recordList.innerHTML=`<div class="empty-state"><span class="empty-icon">${wish?"☾":"✦"}</span><h3>${wish?"보고 싶은 콘텐츠가 없습니다":"아직 기록이 없습니다"}</h3><p>${wish?"나중에 보고 싶은 작품을 가볍게 저장해 보세요.":"첫 감상 기록을 남겨 보세요.<br>별점 하나로 충분합니다."}</p></div>`;return}el.recordList.innerHTML=list.map(r=>{const t=typeInfo(r.type),wish=r.status==="wishlist";return`<article class="record-card" data-record-id="${r.id}"><div class="type-badge">${t.icon}</div><div class="record-main"><h3 class="record-title">${esc(r.title)}</h3><p class="record-meta">${t.label} · ${wish?"보고 싶은 목록":dateText(r.watchedAt)}</p>${wish?(r.note?`<p class="wishlist-note">${esc(r.note)}</p>`:""):`<p class="record-rating">${stars(r.rating)}</p>`}</div><button class="delete-button" type="button" data-delete-id="${r.id}" aria-label="${esc(r.title)} 기록 삭제">⌫</button></article>`}).join("")}
function renderForm(){el.typeChoices.innerHTML=TYPES.filter(t=>t.id!=="all").map(t=>`<button class="type-choice ${state.type===t.id?"selected":""}" type="button" data-type="${t.id}">${t.label}</button>`).join("");el.ratingChoices.innerHTML=[1,2,3,4,5].map(n=>`<button class="star-button ${n<=state.rating?"selected":""}" type="button" data-rating="${n}" aria-label="${n}점">★</button>`).join("");updateMode()}function updateMode(){const wish=el.unseenInput.checked;el.titleLabel.textContent=wish?"무엇을 기록하시나요?":"무엇을 보셨나요?";el.unseenHelp.textContent=wish?"별점 없이 보고 싶은 목록에 저장됩니다.":"켜면 보고 싶은 목록에 저장됩니다.";el.ratingField.classList.toggle("hidden",wish);el.dateField.classList.toggle("hidden",wish);el.watchedAtInput.required=!wish;el.noteLabel.innerHTML=wish?"메모 <span style=\"color:#77776f;font-weight:600\">· 선택</span>":"한 줄 감상 <span style=\"color:#77776f;font-weight:600\">· 선택</span>";el.noteHint.textContent=wish?"왜 저장했는지 또는 언제 볼지 가볍게 남겨 보세요.":"나중의 나에게 남기는 짧은 메모입니다.";el.saveButton.textContent=wish?"보고 싶은 목록에 추가":state.editingWishlistId?"감상 완료로 저장":"기록 저장";validate()}function validate(){el.saveButton.disabled=!(el.titleInput.value.trim()&&(el.unseenInput.checked||state.rating>0))}
function open(o){o.classList.add("show");o.setAttribute("aria-hidden","false")}function close(o){o.classList.remove("show");o.setAttribute("aria-hidden","true")}function toast(m){el.toast.textContent=m;el.toast.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>el.toast.classList.remove("show"),1900)}function openRecord(options={}){state.type=options.type||"movie";state.rating=0;state.editingWishlistId=options.fromWishlist?.id||null;el.recordForm.reset();el.unseenInput.checked=false;el.titleInput.value=options.fromWishlist?.title||"";el.noteInput.value=options.fromWishlist?.note||"";el.watchedAtInput.value=today();renderForm();open(el.recordOverlay);setTimeout(()=>el.titleInput.focus(),260)}
function detail(record){const t=typeInfo(record.type),wish=record.status==="wishlist";el.detailContent.innerHTML=`<div class="detail-icon">${t.icon}</div><h2 class="detail-title">${esc(record.title)}</h2><p class="detail-meta">${t.label} · ${wish?"보고 싶은 목록":dateText(record.watchedAt)}</p>${wish?"":`<p class="detail-rating">${stars(record.rating)}</p>`}${record.note?`<section class="detail-section"><h3>${wish?"메모":"한 줄 감상"}</h3><p>${esc(record.note)}</p></section>`:""}${wish?`<button class="detail-action" id="completeWishlistButton" type="button" data-id="${record.id}">감상 완료로 기록</button>`:""}`;open(el.detailOverlay)}
el.openAddButton.addEventListener("click",()=>openRecord());el.closeRecordButton.addEventListener("click",()=>close(el.recordOverlay));el.closeDetailButton.addEventListener("click",()=>close(el.detailOverlay));el.settingsButton.addEventListener("click",()=>open(el.settingsOverlay));el.closeSettingsButton.addEventListener("click",()=>close(el.settingsOverlay));[el.recordOverlay,el.detailOverlay,el.settingsOverlay].forEach(o=>o.addEventListener("click",e=>{if(e.target===o)close(o)}));document.querySelector(".main-tabs").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(!b)return;state.tab=b.dataset.tab;state.filter="all";renderTabs();renderFilters();renderRecords()});el.filters.addEventListener("click",e=>{const b=e.target.closest("[data-filter]");if(!b)return;state.filter=b.dataset.filter;renderFilters();renderRecords()});el.typeChoices.addEventListener("click",e=>{const b=e.target.closest("[data-type]");if(!b)return;state.type=b.dataset.type;renderForm()});el.ratingChoices.addEventListener("click",e=>{const b=e.target.closest("[data-rating]");if(!b)return;state.rating=Number(b.dataset.rating);renderForm()});el.unseenInput.addEventListener("change",()=>{if(el.unseenInput.checked)state.editingWishlistId=null;updateMode()});el.titleInput.addEventListener("input",validate);
el.recordForm.addEventListener("submit",e=>{e.preventDefault();const title=el.titleInput.value.trim(),wish=el.unseenInput.checked;if(!title||(!wish&&!state.rating))return;if(state.editingWishlistId&&!wish){const old=state.records.find(r=>r.id===state.editingWishlistId);if(old){old.status="completed";old.rating=state.rating;old.watchedAt=el.watchedAtInput.value||today();old.note=el.noteInput.value.trim();old.type=state.type;old.title=title;old.completedAt=new Date().toISOString()}}else{state.records.push({id:uid(),title,type:state.type,status:wish?"wishlist":"completed",rating:wish?null:state.rating,watchedAt:wish?null:(el.watchedAtInput.value||today()),note:el.noteInput.value.trim(),createdAt:new Date().toISOString()})}saveRecords();state.tab=wish?"wishlist":"completed";state.filter="all";renderTabs();renderFilters();renderRecords();close(el.recordOverlay);toast(wish?"보고 싶은 목록에 추가했습니다.":"본 것에 기록했습니다.")});
el.recordList.addEventListener("click",e=>{const del=e.target.closest("[data-delete-id]");if(del){const r=state.records.find(x=>x.id===del.dataset.deleteId);if(!r||!confirm(`“${r.title}” 기록을 삭제하시겠습니까?`))return;state.records=state.records.filter(x=>x.id!==r.id);saveRecords();renderRecords();toast("기록을 삭제했습니다.");return}const card=e.target.closest("[data-record-id]");if(card){const r=state.records.find(x=>x.id===card.dataset.recordId);if(r)detail(r)}});el.detailContent.addEventListener("click",e=>{const b=e.target.closest("#completeWishlistButton");if(!b)return;const r=state.records.find(x=>x.id===b.dataset.id);if(!r)return;close(el.detailOverlay);openRecord({fromWishlist:r})});
el.exportButton.addEventListener("click",()=>{const backup={app:"Seen",version:4,exportedAt:new Date().toISOString(),records:state.records};const blob=new Blob([JSON.stringify(backup,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=`Seen-backup-${today()}.json`;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);toast("백업 파일을 만들었습니다.")});el.importButton.addEventListener("click",()=>el.importInput.click());el.importInput.addEventListener("change",async e=>{const f=e.target.files?.[0];if(!f)return;try{const data=JSON.parse(await f.text()),incoming=Array.isArray(data)?data:data.records;if(!Array.isArray(incoming))throw Error();const valid=incoming.filter(r=>r&&r.id&&r.title&&r.type).map(normalize);if(!confirm(`${valid.length}개의 기록으로 현재 Seen 데이터를 교체하시겠습니까?`))return;state.records=valid;saveRecords();state.tab="completed";state.filter="all";renderTabs();renderFilters();renderRecords();close(el.settingsOverlay);toast(`${valid.length}개 기록을 복원했습니다.`)}catch{alert("Seen 백업 JSON 파일을 읽지 못했습니다.")}finally{e.target.value=""}});el.clearButton.addEventListener("click",()=>{if(!state.records.length)return toast("삭제할 기록이 없습니다.");if(!confirm("정말 모든 Seen 기록을 삭제하시겠습니까? 이 작업은 되돌릴 수 없습니다."))return;state.records=[];saveRecords();renderRecords();close(el.settingsOverlay);toast("모든 기록을 삭제했습니다.")});document.addEventListener("keydown",e=>{if(e.key==="Escape"){close(el.recordOverlay);close(el.detailOverlay);close(el.settingsOverlay)}});renderTabs();renderFilters();renderRecords();renderForm();
</script>
</body>
</html>
